
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JST Salou</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10;--bg2:#12151c;--bg3:#1a1e28;--card:#1e2330;
  --accent:#00c8ff;--accent2:#ff6b35;--gold:#ffc947;
  --text:#e8eaf0;--muted:#6b7280;--border:#2a2f3d;
  --green:#22c55e;--red:#ef4444;--purple:#a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s;}
#splash.hide{opacity:0;pointer-events:none;}
.splash-logo{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:4px;color:var(--accent);text-shadow:0 0 40px rgba(0,200,255,.4);}
.splash-sub{color:var(--muted);font-size:14px;letter-spacing:6px;margin-top:4px;}
.splash-wave{font-size:48px;margin-bottom:20px;animation:bob 1.5s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;flex-direction:column;}
#screen-select{padding:20px;background:var(--bg);}
.select-header{text-align:center;padding:30px 0 24px;}
.select-header h1{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--accent);letter-spacing:3px;}
.lang-bar{display:flex;justify-content:center;gap:8px;margin-bottom:24px;}
.lang-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:12px;cursor:pointer;transition:.2s;}
.lang-btn.active{border-color:var(--accent);color:var(--accent);}
.section-label{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:16px 0 10px;}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:.2s;position:relative;}
.profile-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.profile-card.selected{border-color:var(--accent);background:rgba(0,200,255,.08);}
.p-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 8px;}
.p-name{font-size:13px;font-weight:600;}
.p-role{font-size:10px;color:var(--muted);margin-top:2px;}
.p-badge{position:absolute;top:6px;right:6px;font-size:12px;}
.patron-card .p-avatar{background:linear-gradient(135deg,var(--gold),var(--accent2));}
.chef-card .p-avatar{background:linear-gradient(135deg,var(--accent2),#ff3b6b);}
.cabine-card .p-avatar{background:linear-gradient(135deg,var(--purple),#ec4899);}
.monitor-card .p-avatar{background:linear-gradient(135deg,var(--green),var(--accent));}
#screen-pin{padding:20px;align-items:center;justify-content:center;flex-direction:column;background:var(--bg);}
.pin-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;box-shadow:0 0 30px rgba(0,200,255,.3);}
.pin-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:4px;}
.pin-hint{color:var(--muted);font-size:13px;margin-bottom:32px;text-align:center;}
.pin-dots{display:flex;gap:16px;margin-bottom:32px;}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:.2s;}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(0,200,255,.5);}
.pin-dot.error{background:var(--red);border-color:var(--red);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:240px;}
.num-btn{height:60px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:22px;font-weight:600;cursor:pointer;transition:.2s;}
.num-btn:hover{background:var(--bg3);border-color:var(--accent);}
.num-btn.del{font-size:16px;color:var(--muted);}
.back-btn{margin-top:20px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:8px;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent);letter-spacing:2px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.lang-mini{display:flex;gap:4px;}
.lang-mini button{background:none;border:1px solid transparent;border-radius:6px;font-size:11px;color:var(--muted);cursor:pointer;padding:3px 6px;}
.lang-mini button.active{color:var(--accent);border-color:var(--accent);}
.topbar-user{display:flex;align-items:center;gap:8px;cursor:pointer;}
.topbar-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
.bottom-nav{background:var(--bg2);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0 10px;position:sticky;bottom:0;z-index:100;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 4px;border:none;background:none;color:var(--muted);transition:.2s;}
.nav-item.active{color:var(--accent);}
.nav-icon{font-size:20px;}
.nav-label{font-size:9px;letter-spacing:.5px;}
.content{flex:1;overflow-y:auto;padding:16px 16px 24px;}
.greeting{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;margin-bottom:4px;}
.greeting span{color:var(--accent);}
.date-bar{font-size:12px;color:var(--muted);margin-bottom:20px;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.card-title{font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.task-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.task-item:last-child{border-bottom:none;}
.task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.2s;font-size:12px;}
.task-check.done{background:var(--green);border-color:var(--green);color:#fff;}
.task-text{font-size:13px;flex:1;}
.task-text.done{text-decoration:line-through;color:var(--muted);}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--accent);margin-bottom:4px;}
.section-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
.plan-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;}
.plan-tab{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;white-space:nowrap;cursor:pointer;flex-shrink:0;}
.plan-tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700;}
.exc-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
.exc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.exc-name{font-weight:700;font-size:15px;}
.exc-time{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--accent);}
.exc-detail{font-size:12px;color:var(--muted);}
.exc-duration{display:inline-flex;align-items:center;gap:6px;background:rgba(0,200,255,.1);border:1px solid rgba(0,200,255,.2);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--accent);margin-top:6px;}
.add-btn{width:100%;padding:13px;border-radius:12px;border:1px dashed var(--border);background:none;color:var(--muted);font-size:13px;cursor:pointer;margin-top:10px;transition:.2s;}
.add-btn:hover{border-color:var(--accent);color:var(--accent);}
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 130px);}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.4;}
.msg.mine{background:var(--accent);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px;}
.msg.theirs{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px;}
.msg-meta{font-size:10px;opacity:.7;margin-top:4px;}
.msg.mine .msg-meta{text-align:right;}
.msg-sender{font-weight:700;font-size:11px;margin-bottom:3px;color:var(--accent);}
.msg.mine .msg-sender{color:rgba(0,0,0,.6);}
.chat-input-bar{padding:10px 12px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;}
.chat-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:10px 14px;color:var(--text);font-size:13px;resize:none;max-height:100px;font-family:'DM Sans',sans-serif;}
.chat-input:focus{outline:none;border-color:var(--accent);}
.send-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);border:none;color:var(--bg);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cam-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.msg-img{max-width:200px;border-radius:10px;margin-top:6px;}
.profile-header{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;text-align:center;}
.profile-big-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;}
.profile-big-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.pstat{text-align:center;}
.pstat-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);}
.pstat-label{font-size:10px;color:var(--muted);}
.settings-list{display:flex;flex-direction:column;gap:6px;}
.setting-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.2s;}
.setting-row:hover{border-color:var(--accent);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:flex-end;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease;position:relative;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;margin-bottom:16px;margin-right:30px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block;}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;}
.form-input:focus{outline:none;border-color:var(--accent);}
.form-select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;}
.btn-primary{width:100%;padding:14px;border-radius:12px;background:var(--accent);border:none;color:var(--bg);font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn-danger{width:100%;padding:14px;border-radius:12px;background:rgba(239,68,68,.1);border:1px solid var(--red);color:var(--red);font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn-secondary{width:100%;padding:14px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:15px;cursor:pointer;margin-top:6px;}
.modal-close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--muted);font-size:28px;cursor:pointer;line-height:1;}
#camera-modal{position:fixed;inset:0;background:#000;z-index:600;display:none;flex-direction:column;}
#camera-modal.show{display:flex;}
#camera-video{width:100%;flex:1;object-fit:cover;}
.camera-bar{padding:20px;display:flex;justify-content:center;gap:28px;align-items:center;background:#000;}
.cam-capture{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:30px;}
.cam-cancel{width:46px;height:46px;border-radius:50%;border:2px solid var(--muted);background:none;color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#camera-canvas{display:none;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:10px 20px;font-size:13px;z-index:1000;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.admin-crown{font-size:10px;background:rgba(255,201,71,.15);color:var(--gold);padding:2px 8px;border-radius:8px;margin-left:6px;vertical-align:middle;}
.time-badge{background:rgba(0,200,255,.12);border:1px solid rgba(0,200,255,.25);color:var(--accent);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:600;}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.photo-thumb{aspect-ratio:1;border-radius:8px;object-fit:cover;width:100%;background:var(--bg3);cursor:pointer;display:block;}
.cartel-note{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.cartel-note textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;resize:none;outline:none;line-height:1.6;}
.history-entry{padding:10px 0;border-bottom:1px solid var(--border);}
.history-entry:last-child{border-bottom:none;}
.history-date{color:var(--accent);font-size:10px;margin-bottom:3px;letter-spacing:1px;}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-wave">🌊</div>
  <div class="splash-logo">JST SALOU</div>
  <div class="splash-sub">JET SKI TEAM</div>
</div>

<!-- PROFILE SELECT -->
<div id="screen-select" class="screen">
  <div class="select-header">
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
      <button class="lang-btn" onclick="setLang('es')">🇪🇸 ES</button>
      <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
    </div>
    <div class="splash-wave" style="font-size:32px;margin-bottom:8px">🌊</div>
    <h1>JST SALOU</h1>
    <p id="lbl-select-profile">Sélectionne ton profil</p>
  </div>
  <div style="padding:0 16px 100px">
    <div class="section-label" id="lbl-sec-patron">Patrons</div>
    <div class="profile-grid" id="patrons-grid"></div>
    <div class="section-label" id="lbl-sec-chef">Chefs d'équipe</div>
    <div class="profile-grid" id="chefs-grid"></div>
    <div class="section-label" id="lbl-sec-monitor">Moniteurs</div>
    <div class="profile-grid" id="moniteurs-grid"></div>
    <div class="section-label" id="lbl-sec-cabine">Cabine</div>
    <div class="profile-grid" id="cabine-grid"></div>
    <button class="btn-primary" id="select-confirm" style="display:none;margin-top:8px" onclick="confirmProfile()" id="lbl-confirm">Confirmer</button>
  </div>
</div>

<!-- PIN -->
<div id="screen-pin" class="screen">
  <div style="text-align:center;width:100%;max-width:320px;padding:20px">
    <div class="pin-avatar" id="pin-avatar">😊</div>
    <div class="pin-name" id="pin-name">-</div>
    <div class="pin-hint" id="pin-hint">-</div>
    <div class="pin-dots" id="pin-dots" style="justify-content:center">
      <div class="pin-dot"></div><div class="pin-dot"></div>
      <div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="numpad">
      <button class="num-btn" onclick="pinPress(1)">1</button>
      <button class="num-btn" onclick="pinPress(2)">2</button>
      <button class="num-btn" onclick="pinPress(3)">3</button>
      <button class="num-btn" onclick="pinPress(4)">4</button>
      <button class="num-btn" onclick="pinPress(5)">5</button>
      <button class="num-btn" onclick="pinPress(6)">6</button>
      <button class="num-btn" onclick="pinPress(7)">7</button>
      <button class="num-btn" onclick="pinPress(8)">8</button>
      <button class="num-btn" onclick="pinPress(9)">9</button>
      <button class="num-btn">＊</button>
      <button class="num-btn" onclick="pinPress(0)">0</button>
      <button class="num-btn del" onclick="pinDel()">⌫</button>
    </div>
    <button class="back-btn" onclick="goToSelect()" id="lbl-back">← Retour</button>
  </div>
</div>

<!-- APP -->
<div id="screen-app" class="screen">
  <div class="topbar">
    <div class="topbar-logo">⛵ JST</div>
    <div class="topbar-right">
      <div class="lang-mini">
        <button id="lbtn-fr" onclick="setLang('fr')" class="active">FR</button>
        <button id="lbtn-es" onclick="setLang('es')">ES</button>
        <button id="lbtn-en" onclick="setLang('en')">EN</button>
      </div>
      <div class="topbar-user" onclick="goTab('profil')">
        <div class="topbar-avatar" id="top-avatar" style="background:linear-gradient(135deg,var(--accent),var(--purple))">😊</div>
        <span style="font-size:13px;font-weight:600" id="top-name">-</span>
      </div>
    </div>
  </div>
  <div class="content" id="main-content"></div>
  <div class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="goTab('home')">
      <div class="nav-icon">🏠</div>
      <div class="nav-label" id="lbl-nav-home">Home</div>
    </button>
    <button class="nav-item" id="nav-mer" onclick="goTab('mer')">
      <div class="nav-icon">🌊</div>
      <div class="nav-label" id="lbl-nav-mer">Mer</div>
    </button>
    <button class="nav-item" id="nav-planning" onclick="goTab('planning')">
      <div class="nav-icon">📋</div>
      <div class="nav-label" id="lbl-nav-planning">Planning</div>
    </button>
    <button class="nav-item" id="nav-chat" onclick="goTab('chat')">
      <div class="nav-icon">💬</div>
      <div class="nav-label" id="lbl-nav-chat">Chat</div>
    </button>
    <button class="nav-item" id="nav-profil" onclick="goTab('profil')">
      <div class="nav-icon">👤</div>
      <div class="nav-label" id="lbl-nav-profil">Profil</div>
    </button>
  </div>
</div>

<!-- CAMERA -->
<div id="camera-modal">
  <video id="camera-video" autoplay playsinline></video>
  <canvas id="camera-canvas"></canvas>
  <div class="camera-bar">
    <button class="cam-cancel" onclick="closeCamera()">✕</button>
    <button class="cam-capture" onclick="capturePhoto()">📸</button>
    <button class="cam-cancel" onclick="switchCamera()">🔄</button>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── PROFILES ───────────────────────────────────────────────
const PROFILES=[
  {id:'lucas',name:'Lucas',emoji:'👑',role:'patron',cat:'patron',avatarBg:'linear-gradient(135deg,#ffc947,#ff6b35)'},
  {id:'ema',name:'Ema',emoji:'👑',role:'patron',cat:'patron',avatarBg:'linear-gradient(135deg,#ffc947,#ff6b35)'},

let lang='fr';
let me=null;
let pinBuf='';
let pinNewTemp='';
let pinStep=0; // 0=enter, 1=create1, 2=create2
let activeTab='home';
let planTab='cartel';
let camTarget='planning';
let camStream=null;
let facingMode='environment';

const t=k=>(TR[lang]||TR.fr)[k]||k;

// ─── STORAGE ─────────────────────────────────────────────────
const gs=(k,d=null)=>{try{const v=localStorage.getItem('jst_'+k);return v!=null?JSON.parse(v):d;}catch{return d;}};
const ss=(k,v)=>{try{localStorage.setItem('jst_'+k,JSON.stringify(v));}catch{}};

// Shared = visible to all
const gsh=k=>gs('sh_'+k,[]);
const ssh=(k,v)=>{ss('sh_'+k,v);};

// ─── DAILY RESET ─────────────────────────────────────────────
function checkReset(){
  const today=new Date().toDateString();
  if(gs('last_day','')!==today){
    // archive
    const exc=gsh('excursions');
    if(exc.length){
      const hist=gs('sh_exc_history',[]);
      hist.push({date:gs('last_day',today)||today,exc});
      ss('sh_exc_history',hist);
    }
    ssh('excursions',[]);
    ssh('tasks_done',[]);
    ss('last_day',today);
  }
}

// ─── BOOT ─────────────────────────────────────────────────────
window.addEventListener('load',()=>{
  checkReset();
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
    setTimeout(()=>{
      document.getElementById('splash').style.display='none';
      showScreen('screen-select');
      buildProfiles();
      applyLangUI();
    },600);
  },1800);
});

// ─── LANG ─────────────────────────────────────────────────────
function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  const idx={fr:0,es:1,en:2}[l];
  document.querySelectorAll('.lang-btn')[idx]?.classList.add('active');
  ['fr','es','en'].forEach(x=>document.getElementById('lbtn-'+x)?.classList.remove('active'));
  document.getElementById('lbtn-'+l)?.classList.add('active');
  applyLangUI();
  if(me) renderTab(activeTab);
}

function applyLangUI(){
  // Select screen
  const el=id=>document.getElementById(id);
  if(el('lbl-select-profile')) el('lbl-select-profile').textContent=t('select_profile');
  if(el('lbl-sec-patron')) el('lbl-sec-patron').textContent=t('sec_patron');
  if(el('lbl-sec-chef')) el('lbl-sec-chef').textContent=t('sec_chef');
  if(el('lbl-sec-monitor')) el('lbl-sec-monitor').textContent=t('sec_monitor');
  if(el('lbl-sec-cabine')) el('lbl-sec-cabine').textContent=t('sec_cabine');
  if(el('select-confirm')) el('select-confirm').textContent=t('confirm');
  if(el('lbl-back')) el('lbl-back').textContent=t('back');
  // Nav
  ['home','mer','planning','chat','profil'].forEach(k=>{
    const e=el('lbl-nav-'+k);
    if(e) e.textContent=t('nav_'+k);
  });
}

// ─── SCREEN ───────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── BUILD PROFILE GRID ───────────────────────────────────────
function buildProfiles(){
  const cats=['patron','chef','monitor','cabine'];
  cats.forEach(cat=>{
    const grid=document.getElementById(cat+'s-grid')||document.getElementById(cat==='monitor'?'moniteurs-grid':cat==='cabine'?'cabine-grid':cat+'s-grid');
    const g=document.getElementById(
      cat==='patron'?'patrons-grid':
      cat==='chef'?'chefs-grid':
      cat==='monitor'?'moniteurs-grid':'cabine-grid'
    );
    if(!g)return;
    g.innerHTML='';
    PROFILES.filter(p=>p.cat===cat).forEach(p=>{
      const d=document.createElement('div');
      d.className='profile-card '+cat+'-card';
      d.id='pcard-'+p.id;
      d.onclick=()=>pickProfile(p.id);
      const roleLabel=t('sec_'+cat).replace(/s$/,'').replace(/es$/,'');
      d.innerHTML=`
        ${p.admin?'<div class="p-badge" style="right:auto;left:6px;font-size:10px">👑</div>':''}
        ${p.badge?`<div class="p-badge">${p.badge}</div>`:''}
        <div class="p-avatar" style="background:${p.avatarBg}">${p.emoji}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-role">${roleLabel}</div>
      `;
      g.appendChild(d);
    });
  });
}

let selId=null;
function pickProfile(id){
  document.querySelectorAll('.profile-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('pcard-'+id)?.classList.add('selected');
  selId=id;
  document.getElementById('select-confirm').style.display='block';
}

function confirmProfile(){
  if(!selId)return;
  me=PROFILES.find(p=>p.id===selId);
  const hasPin=!!gs('pin_'+me.id);
  pinBuf='';pinNewTemp='';
  pinStep=hasPin?0:1;
  document.getElementById('pin-avatar').style.background=me.avatarBg;
  document.getElementById('pin-avatar').textContent=me.emoji;
  document.getElementById('pin-name').textContent=me.name+(me.badge?' '+me.badge:'');
  document.getElementById('pin-hint').textContent=hasPin?t('pin_enter'):t('pin_create');
  updateDots();
  showScreen('screen-pin');
}

function goToSelect(){showScreen('screen-select');buildProfiles();}

// ─── PIN ─────────────────────────────────────────────────────
function pinPress(n){
  if(pinBuf.length>=4)return;
  pinBuf+=String(n);updateDots();
  if(pinBuf.length===4)setTimeout(handlePin,200);
}
function pinDel(){pinBuf=pinBuf.slice(0,-1);updateDots();}
function updateDots(err=false){
  document.querySelectorAll('.pin-dot').forEach((d,i)=>{
    d.classList.remove('filled','error');
    if(i<pinBuf.length)d.classList.add(err?'error':'filled');
  });
}
function handlePin(){
  const stored=gs('pin_'+me.id);
  if(!stored){
    // creating pin
    if(pinStep===1){pinNewTemp=pinBuf;pinBuf='';pinStep=2;document.getElementById('pin-hint').textContent=t('pin_confirm_step');updateDots();}
    else{
      if(pinBuf===pinNewTemp){ss('pin_'+me.id,pinBuf);toast(t('pin_set'));enterApp();}
      else{toast(t('pin_mismatch'));pinNewTemp='';pinBuf='';pinStep=1;updateDots(true);setTimeout(()=>{document.getElementById('pin-hint').textContent=t('pin_create');updateDots();},600);}
    }
  } else {
    if(pinBuf===stored){enterApp();}
    else{toast(t('pin_wrong'));pinBuf='';updateDots(true);setTimeout(()=>updateDots(),600);}
  }
}

function enterApp(){
  document.getElementById('top-avatar').textContent=me.emoji;
  document.getElementById('top-avatar').style.background=me.avatarBg;
  document.getElementById('top-name').textContent=me.name+(me.badge?' '+me.badge:'');
  showScreen('screen-app');
  applyLangUI();
  goTab('home');
}

// ─── TABS ─────────────────────────────────────────────────────
function goTab(tab){
  activeTab=tab;
  ['home','mer','planning','chat','profil'].forEach(k=>{
    document.getElementById('nav-'+k)?.classList.toggle('active',k===tab);
  });
  renderTab(tab);
}

function renderTab(tab){
  const c=document.getElementById('main-content');
  if(tab==='home')c.innerHTML=buildHome();
  else if(tab==='mer')c.innerHTML=buildMer();
  else if(tab==='planning')c.innerHTML=buildPlanning();
  else if(tab==='chat'){buildChat(c);}
  else if(tab==='profil')c.innerHTML=buildProfil();
}

// ─── HOME ─────────────────────────────────────────────────────
function buildHome(){
  const h=new Date().getHours();
  const greet=h<12?t('good_morning'):h<18?t('good_afternoon'):t('good_evening');
  const now=new Date();
  const dloc=now.toLocaleDateString(lang==='fr'?'fr-FR':lang==='es'?'es-ES':'en-GB',{weekday:'long',day:'numeric',month:'long'});
  const exc=gsh('excursions');
  const done=gsh('tasks_done');
  const totalMin=exc.reduce((s,e)=>s+(e.duration||0),0);
  const h2=Math.floor(totalMin/60);const m2=totalMin%60;
  const isMonitor=['tim','llorens','munir','nico'].includes(me.id);

  const taskHtml=isMonitor?`
  <div class="card">
    <div class="card-title">${t('today_tasks')} <span style="color:var(--accent2)">${done.length}/${FIXED_TASKS.length}</span></div>
    ${FIXED_TASKS.map(tk=>{
      const isDone=done.includes(tk.id);
      return `<div class="task-item" onclick="toggleTask('${tk.id}')">
        <div class="task-check ${isDone?'done':''}">${isDone?'✓':''}</div>
        <div class="task-text ${isDone?'done':''}">${t(tk.key)}</div>
      </div>`;
    }).join('')}
  </div>`:'';

  return `
    <div class="greeting">${greet}, <span>${me.name}</span>${me.admin?`<span class="admin-crown">👑 Admin</span>`:''}</div>
    <div class="date-bar">${dloc} — Salou</div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${exc.length}</div><div class="stat-label">${t('sessions_done')}</div></div>
      <div class="stat-card"><div class="stat-num">${h2}${t('hours_label')}${m2?m2+t('min_label'):''}</div><div class="stat-label">${t('time_sea')}</div></div>
      <div class="stat-card"><div class="stat-num">${done.length}/${FIXED_TASKS.length}</div><div class="stat-label">${t('tasks_done_lbl')}</div></div>
    </div>
    ${taskHtml}
    <div class="card">
      <div class="card-title">${t('sea_title')}</div>
      ${exc.length===0?`<div style="color:var(--muted);font-size:13px;text-align:center;padding:12px">${t('no_exc')}</div>`:''}
      ${exc.slice(-3).map(e=>{
        const p=PROFILES.find(x=>x.id===e.monitorId);
        const dh=Math.floor(e.duration/60);const dm=e.duration%60;
        return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:22px">${p?p.emoji:'🤿'}</div>
          <div style="flex:1"><div style="font-size:13px;font-weight:600">${p?p.name:'?'}</div><div style="font-size:11px;color:var(--muted)">${e.time}</div></div>
          <div class="time-badge">${dh?dh+t('hours_label'):''}${dm?dm+t('min_label'):''}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function toggleTask(id){
  const d=gsh('tasks_done');
  const i=d.indexOf(id);if(i>=0)d.splice(i,1);else d.push(id);
  ssh('tasks_done',d);renderTab('home');
}

// ─── MER ─────────────────────────────────────────────────────
function buildMer(){
  const exc=gsh('excursions');
  const monitors=PROFILES.filter(p=>p.cat==='monitor');
  const canAdd=['tim','llorens','munir','nico','lucas','ema','nacho','miha'].includes(me.id);

  // total per monitor
  const totals={};
  exc.forEach(e=>{totals[e.monitorId]=(totals[e.monitorId]||0)+(e.duration||0);});

  return `
    <div class="section-title">${t('sea_title')}</div>
    <div class="section-sub">${t('sea_sub')}</div>
    <div class="card" style="margin-bottom:14px">
      ${monitors.map(m=>{
        const total=totals[m.id]||0;
        const th=Math.floor(total/60);const tm=total%60;
        const myExc=exc.filter(e=>e.monitorId===m.id);
        return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="width:40px;height:40px;border-radius:50%;background:${m.avatarBg};display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${m.emoji}</div>
          <div style="flex:1">
            <div style="font-size:14px;font-weight:700">${m.name} ${m.badge||''}</div>
            <div style="font-size:11px;color:var(--muted)">${myExc.length} sortie${myExc.length>1?'s':''}</div>
          </div>
          <div class="time-badge" style="${total===0?'opacity:.4':''}">${total===0?'—':''} ${th?th+t('hours_label'):''}${tm?tm+t('min_label'):''}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-title" style="font-size:20px;margin-bottom:10px">Détail</div>
    ${exc.length===0?`<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">${t('no_exc')}</div>`:''}
    ${exc.map((e,i)=>{
      const p=PROFILES.find(x=>x.id===e.monitorId);
      const dh=Math.floor(e.duration/60);const dm=e.duration%60;
      const canDel=me.admin||e.monitorId===me.id;
      return `<div class="exc-card">
        <div class="exc-header">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:38px;height:38px;border-radius:50%;background:${p?p.avatarBg:'#333'};display:flex;align-items:center;justify-content:center;font-size:16px">${p?p.emoji:'🤿'}</div>
            <div>
              <div class="exc-name">${p?p.name:'?'}</div>
              <div class="exc-detail">${e.time}${e.note?' · '+e.note:''}</div>
            </div>
          </div>
          ${canDel?`<button onclick="delExc(${i})" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer">🗑</button>`:''}
        </div>
        <div class="exc-duration">⏱ ${dh?dh+t('hours_label'):''}${dm?dm+t('min_label'):''}</div>
      </div>`;
    }).join('')}
    ${canAdd?`<button class="add-btn" onclick="openAddExc()">${t('add_exc')}</button>`:''}
  `;
}

        <option value="120">2h</option>
        <option value="150">2h30</option>
        <option value="180">3h</option>
      </select></div>
    <div class="form-group"><label class="form-label">${t('exc_note')}</label>
      <input class="form-input" id="m-note" type="text" placeholder="..."></div>
    <button class="btn-primary" onclick="saveExc()">${t('save')}</button>
    <button class="btn-secondary" onclick="closeModal()">${t('cancel')}</button>
  `);
}

function saveExc(){
  const monitorId=document.getElementById('m-monitor').value;
  const duration=parseInt(document.getElementById('m-dur').value);
  const note=document.getElementById('m-note').value;
  const exc=gsh('excursions');
  exc.push({monitorId,duration,note,time:new Date().toLocaleTimeString().slice(0,5),date:new Date().toISOString(),by:me.id});
  ssh('excursions',exc);
  closeModal();renderTab('mer');toast('✅ Excursion ajoutée');
}

function delExc(i){
  const exc=gsh('excursions');exc.splice(i,1);ssh('excursions',exc);renderTab('mer');
}

// ─── PLANNING ────────────────────────────────────────────────
function buildPlanning(){
  const photos=gsh('photos');
  const tabs=[
    {id:'cartel',label:t('tab_cartel')},
    {id:'photos',label:t('tab_photos')+(photos.length?` (${photos.length})`:' ')},
    {id:'exc',label:t('tab_exc')},
  ];
  return `
    <div class="section-title">${t('planning_title')}</div>
    <div class="plan-tabs">
      ${tabs.map(tb=>`<button class="plan-tab ${planTab===tb.id?'active':''}" onclick="setPlanTab('${tb.id}')">${tb.label}</button>`).join('')}
    </div>
    <div id="plan-body">${buildPlanBody()}</div>
  `;
}

function setPlanTab(tab){planTab=tab;document.getElementById('plan-body').innerHTML=buildPlanBody();}

function buildPlanBody(){
  if(planTab==='cartel'){
    const note=gs('cartel_note','');
    return `
      <div style="margin-bottom:12px">
        <button class="btn-primary" style="margin-bottom:10px" onclick="openCamera('planning')">${t('take_photo')}</button>
      </div>
      <div class="cartel-note">
        <textarea rows="8" id="cartel-text" placeholder="${t('cartel_hint')}" oninput="saveCartelNote(this.value)">${note}</textarea>
      </div>
    `;
  }
  if(planTab==='photos'){
    const photos=gsh('photos');
    return `
      ${photos.length===0?`<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">${t('no_photos')}</div>`:''}
      <div class="photo-grid">
        ${photos.map((p,i)=>`
          <div style="position:relative">
            <img src="${p.data}" class="photo-thumb" onclick="viewPhoto(${i})">
            <div style="position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.75);border-radius:4px;padding:2px 5px;font-size:9px;color:#fff">${p.by} ${p.time}</div>
          </div>
        `).join('')}
      </div>
    `;
  }
  if(planTab==='exc'){
    const exc=gsh('excursions');
    return `
      ${exc.length===0?`<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">${t('no_exc')}</div>`:''}
      ${exc.map((e,i)=>{
        const p=PROFILES.find(x=>x.id===e.monitorId);
        const dh=Math.floor(e.duration/60);const dm=e.duration%60;
        const canDel=me.admin||e.monitorId===me.id;
        return `<div class="exc-card">
          <div class="exc-header">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:36px;height:36px;border-radius:50%;background:${p?p.avatarBg:'#333'};display:flex;align-items:center;justify-content:center;font-size:16px">${p?p.emoji:'🤿'}</div>
              <div><div class="exc-name">${p?p.name:'?'}</div><div class="exc-detail">${e.time}${e.note?' · '+e.note:''}</div></div>
            </div>
            ${canDel?`<button onclick="delExcPlanning(${i})" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer">🗑</button>`:''}
          </div>
          <div class="exc-duration">⏱ ${dh?dh+t('hours_label'):''}${dm?dm+t('min_label'):''}</div>
        </div>`;
      }).join('')}
    `;
  }
}

function saveCartelNote(v){ss('cartel_note',v);}
function delExcPlanning(i){delExc(i);setPlanTab('exc');}

function viewPhoto(i){
  const p=gsh('photos')[i];if(!p)return;
  showModal(`<img src="${p.data}" style="width:100%;border-radius:10px"><div style="font-size:12px;color:var(--muted);margin-top:8px">📸 ${p.by} — ${p.date}</div>`);
}

// ─── CHAT ─────────────────────────────────────────────────────
function buildChat(c){
  const msgs=gsh('messages');
  c.innerHTML=`
    <div class="chat-container">
      <div class="chat-messages" id="chat-msgs">
        ${msgs.length===0?`<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;margin-top:30px">💬 ${t('no_messages')}</div>`:''}
        ${msgs.map(m=>{
          const mine=m.uid===me.id;
          const sender=PROFILES.find(p=>p.id===m.uid);
          if(m.type==='photo'){
            return `<div class="msg ${mine?'mine':'theirs'}">
              ${!mine?`<div class="msg-sender">${sender?.emoji||''} ${m.user}</div>`:''}
              <img src="${m.data}" class="msg-img">
              <div class="msg-meta">${m.time}</div>
            </div>`;
          }
          return `<div class="msg ${mine?'mine':'theirs'}">
            ${!mine?`<div class="msg-sender">${sender?.emoji||''} ${m.user}</div>`:''}
            <div>${m.text}</div>
            <div class="msg-meta">${m.time}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="chat-input-bar">
        <button class="cam-btn" onclick="openCamera('chat')">📷</button>
        <textarea class="chat-input" id="chat-input" placeholder="${t('type_msg')}" rows="1" onkeydown="chatKey(event)"></textarea>
        <button class="send-btn" onclick="sendMsg()">↑</button>
      </div>
    </div>
  `;
  const el=document.getElementById('chat-msgs');
  if(el)el.scrollTop=el.scrollHeight;
}

function chatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}

function sendMsg(){
  const inp=document.getElementById('chat-input');
  const text=(inp.value||'').trim();if(!text)return;
  const msgs=gsh('messages');
  msgs.push({uid:me.id,user:me.name,text,time:new Date().toLocaleTimeString().slice(0,5),date:new Date().toISOString()});
  ssh('messages',msgs);inp.value='';
  buildChat(document.getElementById('main-content'));
}

// ─── PROFIL ───────────────────────────────────────────────────
function buildProfil(){
  const exc=gsh('excursions');
  const hist=gs('sh_exc_history',[]);
  const myExcToday=exc.filter(e=>e.monitorId===me.id);
  const myMinToday=myExcToday.reduce((s,e)=>s+(e.duration||0),0);
  const allMyMin=hist.reduce((s,d)=>s+d.exc.filter(e=>e.monitorId===me.id).reduce((a,e)=>a+(e.duration||0),0),0)+myMinToday;
  const allMyExc=hist.reduce((s,d)=>s+d.exc.filter(e=>e.monitorId===me.id).length,0)+myExcToday.length;
  const th=Math.floor(allMyMin/60);const tm=allMyMin%60;
  const isAdmin=me.admin;

  return `
    <div class="profile-header">
      <div class="profile-big-avatar" style="background:${me.avatarBg}">${me.emoji}</div>
      <div class="profile-big-name">${me.name} ${me.badge||''}</div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">${me.role}${me.admin?` <span class="admin-crown">👑 Admin</span>`:''}</div>
      <div class="profile-stats">
        <div class="pstat"><div class="pstat-num">${th?th+'h':'0h'}${tm?tm+'m':''}</div><div class="pstat-label">${t('my_time_sea')}</div></div>
        <div class="pstat"><div class="pstat-num">${allMyExc}</div><div class="pstat-label">${t('my_sessions')}</div></div>
        <div class="pstat"><div class="pstat-num">${hist.length}</div><div class="pstat-label">${t('my_days')}</div></div>
      </div>
    </div>
    <div class="settings-list">
      <div class="setting-row" onclick="openChangePIN()"><span>${t('change_pin')}</span><span style="color:var(--muted)">›</span></div>
      ${isAdmin?`<div class="setting-row" onclick="openAdmin()"><span>${t('admin_panel')}</span><span style="color:var(--muted)">›</span></div>`:''}
      <div class="setting-row" onclick="openHistory()"><span>${t('history_label')}</span><span style="color:var(--muted)">›</span></div>
      <div class="setting-row" style="color:var(--red)" onclick="doLogout()"><span>${t('logout')}</span><span style="color:var(--red)">›</span></div>
    </div>
  `;
}

function doLogout(){me=null;showScreen('screen-select');buildProfiles();}

function openHistory(){
  const exc=gsh('excursions');
  const hist=gs('sh_exc_history',[]);
  const all=[{date:t('history_today'),exc},...hist.slice(-10).reverse()];
  showModal(`<h3>${t('history_label')}</h3>
    ${all.filter(d=>d.exc.length>0).map(d=>{
      const totalMin=d.exc.reduce((s,e)=>s+(e.duration||0),0);
      const th=Math.floor(totalMin/60);const tm=totalMin%60;
      return `<div class="history-entry">
        <div class="history-date">${d.date}</div>
        <div style="font-size:13px">${d.exc.length} excursions — ${th?th+'h':''}${tm?tm+'min':''} total</div>
        ${d.exc.map(e=>{const p=PROFILES.find(x=>x.id===e.monitorId);const dh=Math.floor(e.duration/60);const dm=e.duration%60;return `<div style="font-size:11px;color:var(--muted);margin-top:2px">• ${e.time} — ${p?p.name:'?'} (${dh?dh+'h':''}${dm?dm+'min':''})</div>`;}).join('')}
      </div>`;
    }).join('')||`<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">${t('history_empty')}</div>`}
  `);
}

function openAdmin(){
  showModal(`<h3>${t('admin_panel')}</h3>
    <button class="btn-danger" onclick="adminReset()">${t('admin_reset')}</button>
    <button class="btn-secondary" onclick="adminClearChat()">${t('admin_clear_chat')}</button>
    <button class="btn-secondary" onclick="adminClearPhotos()">${t('admin_clear_photos')}</button>
    <button class="btn-secondary" onclick="closeModal()">${t('cancel')}</button>
  `);
}
function adminReset(){
  const exc=gsh('excursions');const today=new Date().toDateString();
  if(exc.length){const h=gs('sh_exc_history',[]);h.push({date:today,exc});ss('sh_exc_history',h);}
  ssh('excursions',[]);ssh('tasks_done',[]);
  closeModal();renderTab('home');toast('✅ Reset effectué');
}
function adminClearChat(){ssh('messages',[]);closeModal();toast('✅ Chat effacé');}
function adminClearPhotos(){ssh('photos',[]);closeModal();toast('✅ Photos effacées');}

function openChangePIN(){
  let step=1,first='';
  showModal(`<h3>${t('change_pin')}</h3>
    <div id="cp-hint" style="color:var(--muted);font-size:13px;margin-bottom:16px">${t('new_pin')}</div>
    <div style="display:flex;gap:14px;justify-content:center;margin-bottom:20px">
      <div class="pin-dot" id="cpd0"></div><div class="pin-dot" id="cpd1"></div>
      <div class="pin-dot" id="cpd2"></div><div class="pin-dot" id="cpd3"></div>
    </div>
    <div class="numpad" style="margin:0 auto">
      ${[1,2,3,4,5,6,7,8,9,'＊',0,'⌫'].map(n=>`<button class="num-btn" onclick="cpPress('${n}')">${n}</button>`).join('')}
    </div>
  `);
  window._cp={step,buf:'',first};
}
function cpPress(n){
  const s=window._cp;if(!s)return;
  if(n==='⌫'){s.buf=s.buf.slice(0,-1);}
  else if(n!=='＊'&&s.buf.length<4){s.buf+=String(n);}
  for(let i=0;i<4;i++){const d=document.getElementById('cpd'+i);if(d)d.classList.toggle('filled',i<s.buf.length);}
  if(s.buf.length===4){
    setTimeout(()=>{
      if(s.step===1){s.first=s.buf;s.buf='';s.step=2;document.getElementById('cp-hint').textContent=t('confirm_pin_lbl');for(let i=0;i<4;i++){const d=document.getElementById('cpd'+i);if(d)d.classList.remove('filled');}}
      else{
        if(s.buf===s.first){ss('pin_'+me.id,s.buf);closeModal();toast(t('pin_changed'));}
        else{toast(t('pin_mismatch'));s.step=1;s.buf='';s.first='';document.getElementById('cp-hint').textContent=t('new_pin');for(let i=0;i<4;i++){const d=document.getElementById('cpd'+i);if(d)d.classList.remove('filled');}}
      }
    },200);
  }
}

// ─── CAMERA ───────────────────────────────────────────────────
async function openCamera(target){
  camTarget=target;
  const modal=document.getElementById('camera-modal');
  modal.classList.add('show');
  try{
    if(camStream)camStream.getTracks().forEach(t=>t.stop());
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode},audio:false});
    document.getElementById('camera-video').srcObject=camStream;
  }catch(e){modal.classList.remove('show');toast(t('camera_err'));}
}
function closeCamera(){if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null;document.getElementById('camera-modal').classList.remove('show');}
function switchCamera(){facingMode=facingMode==='environment'?'user':'environment';openCamera(camTarget);}
function capturePhoto(){
  const v=document.getElementById('camera-video'),cv=document.getElementById('camera-canvas');
  cv.width=v.videoWidth;cv.height=v.videoHeight;
  cv.getContext('2d').drawImage(v,0,0);
  const data=cv.toDataURL('image/jpeg',0.75);
  const now=new Date();
  const timeStr=now.toLocaleTimeString().slice(0,5);
  const dateStr=now.toLocaleDateString();
  const photos=gsh('photos');
  photos.unshift({data,by:me.name,time:timeStr,date:dateStr,uid:me.id});
  ssh('photos',photos);
  if(camTarget==='chat'){
    const msgs=gsh('messages');
    msgs.push({uid:me.id,user:me.name,type:'photo',data,time:timeStr,date:now.toISOString()});
    ssh('messages',msgs);
  }
  closeCamera();
  toast(t('photo_sent'));
  if(camTarget==='chat'){buildChat(document.getElementById('main-content'));}
  else{planTab='photos';renderTab('planning');}
}

// ─── MODAL ────────────────────────────────────────────────────
function showModal(html){
  document.getElementById('modal-content').innerHTML=`<button class="modal-close" onclick="closeModal()">×</button>${html}`;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show');window._cp=null;}
function overlayClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

// ─── TOAST ────────────────────────────────────────────────────
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}

// ─── SYNC (polling) ───────────────────────────────────────────
window.addEventListener('storage',e=>{if(e.key&&e.key.startsWith('jst_sh_')&&me)renderTab(activeTab);});
setInterval(()=>{if(me)renderTab(activeTab);},4000);
</script>
</body>
</html>
