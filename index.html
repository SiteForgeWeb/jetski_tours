<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JST Salou</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c10;--bg2:#12151c;--bg3:#1a1e28;--card:#1e2330;--accent:#00c8ff;--accent2:#ff6b35;--gold:#ffc947;--text:#e8eaf0;--muted:#6b7280;--border:#2a2f3d;--green:#22c55e;--red:#ef4444;--purple:#a78bfa;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s;}
#splash.hide{opacity:0;pointer-events:none;}
.splash-logo{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:4px;color:var(--accent);text-shadow:0 0 40px rgba(0,200,255,.4);}
.splash-sub{color:var(--muted);font-size:14px;letter-spacing:6px;margin-top:4px;}
.splash-wave{font-size:48px;margin-bottom:20px;animation:bob 1.5s ease-in-out infinite;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:16px;animation:pulse 1.5s infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;flex-direction:column;}
#screen-select{padding:20px;background:var(--bg);}
.select-header{text-align:center;padding:24px 0 20px;}
.select-header h1{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--accent);letter-spacing:3px;}
.lang-bar{display:flex;justify-content:center;gap:8px;margin-bottom:20px;}
.lang-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:12px;cursor:pointer;}
.lang-btn.active{border-color:var(--accent);color:var(--accent);}
.section-label{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:14px 0 8px;}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px;}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:.2s;position:relative;}
.profile-card:active{transform:scale(.97);}
.profile-card.selected{border-color:var(--accent);background:rgba(0,200,255,.08);}
.p-avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 8px;}
.p-name{font-size:13px;font-weight:600;}
.p-role{font-size:10px;color:var(--muted);margin-top:2px;}
.p-badge{position:absolute;top:6px;right:6px;font-size:12px;}
#screen-pin{align-items:center;justify-content:center;flex-direction:column;background:var(--bg);}
.pin-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;}
.pin-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:4px;}
.pin-hint{color:var(--muted);font-size:13px;margin-bottom:28px;text-align:center;padding:0 20px;}
.pin-dots{display:flex;gap:16px;margin-bottom:28px;justify-content:center;}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);transition:.2s;}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);}
.pin-dot.error{background:var(--red);border-color:var(--red);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:240px;}
.num-btn{height:60px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:22px;font-weight:600;cursor:pointer;}
.num-btn:active{background:var(--bg3);}
.back-btn{margin-top:16px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:8px;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent);letter-spacing:2px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.lang-mini{display:flex;gap:4px;}
.lang-mini button{background:none;border:1px solid transparent;border-radius:6px;font-size:11px;color:var(--muted);cursor:pointer;padding:3px 6px;}
.lang-mini button.active{color:var(--accent);border-color:var(--accent);}
.topbar-user{display:flex;align-items:center;gap:8px;cursor:pointer;}
.topbar-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
.sync-ind{width:8px;height:8px;border-radius:50%;background:var(--green);}
.sync-ind.off{background:var(--red);}
.bottom-nav{background:var(--bg2);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0 10px;position:sticky;bottom:0;z-index:100;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 4px;border:none;background:none;color:var(--muted);}
.nav-item.active{color:var(--accent);}
.nav-icon{font-size:20px;}
.nav-label{font-size:9px;letter-spacing:.5px;}
.content{flex:1;overflow-y:auto;padding:16px 16px 24px;}
.greeting{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;margin-bottom:4px;}
.greeting span{color:var(--accent);}
.date-bar{font-size:12px;color:var(--muted);margin-bottom:20px;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.card-title{font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.task-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.task-item:last-child{border-bottom:none;}
.task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:12px;transition:.2s;}
.task-check.done{background:var(--green);border-color:var(--green);color:#fff;}
.task-text{font-size:13px;flex:1;}
.task-text.done{text-decoration:line-through;color:var(--muted);}
.task-assign{font-size:11px;color:var(--accent);margin-top:2px;}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--accent);margin-bottom:4px;}
.section-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
.plan-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;}
.plan-tab{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;white-space:nowrap;cursor:pointer;flex-shrink:0;}
.plan-tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700;}
.exc-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
.exc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.exc-name{font-weight:700;font-size:15px;}
.exc-detail{font-size:12px;color:var(--muted);}
.exc-duration{display:inline-flex;align-items:center;gap:6px;background:rgba(0,200,255,.1);border:1px solid rgba(0,200,255,.2);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--accent);}
.add-btn{width:100%;padding:13px;border-radius:12px;border:1px dashed var(--border);background:none;color:var(--muted);font-size:13px;cursor:pointer;margin-top:10px;}
.add-btn:active{border-color:var(--accent);color:var(--accent);}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 130px);}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.4;}
.msg.mine{background:var(--accent);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px;}
.msg.theirs{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px;}
.msg-meta{font-size:10px;opacity:.7;margin-top:4px;}
.msg.mine .msg-meta{text-align:right;}
.msg-sender{font-weight:700;font-size:11px;margin-bottom:3px;color:var(--accent);}
.msg.mine .msg-sender{color:rgba(0,0,0,.6);}
.chat-bar{padding:10px 12px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;}
.chat-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:10px 14px;color:var(--text);font-size:13px;resize:none;max-height:100px;font-family:'DM Sans',sans-serif;}
.chat-input:focus{outline:none;border-color:var(--accent);}
.send-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);border:none;color:var(--bg);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cam-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.msg-img{max-width:200px;border-radius:10px;margin-top:6px;}
.profile-header{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;text-align:center;}
.profile-big-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;}
.profile-big-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.pstat{text-align:center;}
.pstat-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);}
.pstat-label{font-size:10px;color:var(--muted);}
.settings-list{display:flex;flex-direction:column;gap:6px;}
.setting-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:flex-end;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px 20px 36px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease;position:relative;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;margin-bottom:16px;margin-right:30px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block;}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;}
.form-input:focus{outline:none;border-color:var(--accent);}
.form-select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;}
.btn-primary{width:100%;padding:14px;border-radius:12px;background:var(--accent);border:none;color:var(--bg);font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn-danger{width:100%;padding:14px;border-radius:12px;background:rgba(239,68,68,.1);border:1px solid var(--red);color:var(--red);font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn-secondary{width:100%;padding:14px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:15px;cursor:pointer;margin-top:6px;}
.modal-close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--muted);font-size:28px;cursor:pointer;line-height:1;}
#camera-modal{position:fixed;inset:0;background:#000;z-index:600;display:none;flex-direction:column;}
#camera-modal.show{display:flex;}
#camera-video{width:100%;flex:1;object-fit:cover;}
.camera-bar{padding:20px;display:flex;justify-content:center;gap:28px;align-items:center;background:#000;}
.cam-capture{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:30px;}
.cam-side{width:46px;height:46px;border-radius:50%;border:2px solid var(--muted);background:none;color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#camera-canvas{display:none;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:10px 20px;font-size:13px;z-index:1000;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.admin-crown{font-size:10px;background:rgba(255,201,71,.15);color:var(--gold);padding:2px 8px;border-radius:8px;margin-left:6px;vertical-align:middle;}
.time-badge{background:rgba(0,200,255,.12);border:1px solid rgba(0,200,255,.25);color:var(--accent);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:600;}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.photo-thumb{aspect-ratio:1;border-radius:8px;object-fit:cover;width:100%;background:var(--bg3);cursor:pointer;display:block;}
.cartel-note{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px;}
.cartel-note textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;resize:none;outline:none;line-height:1.6;}
.history-entry{padding:10px 0;border-bottom:1px solid var(--border);}
.history-entry:last-child{border-bottom:none;}
.history-date{color:var(--accent);font-size:10px;margin-bottom:3px;letter-spacing:1px;}
.monitor-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.monitor-row:last-child{border-bottom:none;}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-wave">🌊</div>
  <div class="splash-logo">JST SALOU</div>
  <div class="splash-sub">JET SKI TEAM</div>
  <div class="sync-dot" id="splash-dot"></div>
</div>

<div id="screen-select" class="screen">
  <div class="select-header">
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
      <button class="lang-btn" onclick="setLang('es')">🇪🇸 ES</button>
      <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
    </div>
    <div style="font-size:32px;margin-bottom:8px">🌊</div>
    <h1>JST SALOU</h1>
    <p id="lbl-sel" style="color:var(--muted);font-size:13px;margin-top:4px">Sélectionne ton profil</p>
  </div>
  <div style="padding:0 16px 100px">
    <div class="section-label" id="lbl-s-patron">Patrons</div>
    <div class="profile-grid" id="g-patron"></div>
    <div class="section-label" id="lbl-s-chef">Chefs d'équipe</div>
    <div class="profile-grid" id="g-chef"></div>
    <div class="section-label" id="lbl-s-monitor">Moniteurs</div>
    <div class="profile-grid" id="g-monitor"></div>
    <div class="section-label" id="lbl-s-cabine">Cabine</div>
    <div class="profile-grid" id="g-cabine"></div>
    <button class="btn-primary" id="btn-confirm" style="display:none;margin-top:8px" onclick="confirmProfile()">Confirmer</button>
  </div>
</div>

<div id="screen-pin" class="screen">
  <div style="text-align:center;width:100%;max-width:320px;padding:24px;margin:auto">
    <div class="pin-avatar" id="pin-av">😊</div>
    <div class="pin-name" id="pin-nm">-</div>
    <div class="pin-hint" id="pin-hint">-</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="numpad">
      <button class="num-btn" onclick="pp(1)">1</button><button class="num-btn" onclick="pp(2)">2</button><button class="num-btn" onclick="pp(3)">3</button>
      <button class="num-btn" onclick="pp(4)">4</button><button class="num-btn" onclick="pp(5)">5</button><button class="num-btn" onclick="pp(6)">6</button>
      <button class="num-btn" onclick="pp(7)">7</button><button class="num-btn" onclick="pp(8)">8</button><button class="num-btn" onclick="pp(9)">9</button>
      <button class="num-btn" style="color:var(--muted)">＊</button><button class="num-btn" onclick="pp(0)">0</button>
      <button class="num-btn" style="font-size:16px;color:var(--muted)" onclick="pdel()">⌫</button>
    </div>
    <button class="back-btn" onclick="goSel()" id="lbl-back">← Retour</button>
  </div>
</div>

<div id="screen-app" class="screen">
  <div class="topbar">
    <div class="topbar-logo">⛵ JST</div>
    <div class="topbar-right">
      <div class="lang-mini">
        <button id="lb-fr" onclick="setLang('fr')" class="active">FR</button>
        <button id="lb-es" onclick="setLang('es')">ES</button>
        <button id="lb-en" onclick="setLang('en')">EN</button>
      </div>
      <div class="sync-ind" id="sync-dot"></div>
      <div class="topbar-user" onclick="goTab('profil')">
        <div class="topbar-avatar" id="top-av"></div>
        <span style="font-size:13px;font-weight:600" id="top-nm">-</span>
      </div>
    </div>
  </div>
  <div class="content" id="main-c"></div>
  <div class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="goTab('home')"><div class="nav-icon">🏠</div><div class="nav-label" id="lb-nav-home">Home</div></button>
    <button class="nav-item" id="nav-mer" onclick="goTab('mer')"><div class="nav-icon">🌊</div><div class="nav-label" id="lb-nav-mer">Mer</div></button>
    <button class="nav-item" id="nav-planning" onclick="goTab('planning')"><div class="nav-icon">📋</div><div class="nav-label" id="lb-nav-planning">Planning</div></button>
    <button class="nav-item" id="nav-chat" onclick="goTab('chat')"><div class="nav-icon">💬</div><div class="nav-label" id="lb-nav-chat">Chat</div></button>
    <button class="nav-item" id="nav-profil" onclick="goTab('profil')"><div class="nav-icon">👤</div><div class="nav-label" id="lb-nav-profil">Profil</div></button>
  </div>
</div>

<div id="camera-modal">
  <video id="camera-video" autoplay playsinline></video>
  <canvas id="camera-canvas"></canvas>
  <div class="camera-bar">
    <button class="cam-side" onclick="closeCamera()">✕</button>
    <button class="cam-capture" onclick="capturePhoto()">📸</button>
    <button class="cam-side" onclick="switchCam()">🔄</button>
  </div>
</div>

<div class="modal-overlay" id="modal-ov" onclick="ovClick(event)">
  <div class="modal" id="modal-c"><button class="modal-close" onclick="closeModal()">×</button></div>
</div>
<div class="toast" id="toast"></div>

const PROFILES=[

// 4 tâches, 4 moniteurs, rotation quotidienne selon le numéro du jour
// Chaque jour l'attribution change — ex: lundi Tim=circuit, mardi Tim=nettoyage etc.
const TASK_NAMES = ['task_circuit','task_nettoyage','task_ranger','task_gasoil'];
const MONITOR_IDS = ['tim','llorens','munir','nico'];

function getDailyTasks(){
  // Décalage basé sur le numéro du jour de l'année → change chaque jour
  const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(),0,0)) / 86400000);
  return MONITOR_IDS.map((monitorId, i) => ({
    id: TASK_NAMES[(i + dayOfYear) % 4],
    key: TASK_NAMES[(i + dayOfYear) % 4],
    monitorId
  }));
}

function todayKey(){return new Date().toISOString().slice(0,10);}

async function fbSet(path,data){
  const {doc,setDoc}=window.FS;
  const parts=path.split('/');
  await setDoc(doc(window.db,...parts),data,{merge:true});
}
async function fbGet(path){
  const {doc,getDoc}=window.FS;
  const parts=path.split('/');
  const snap=await getDoc(doc(window.db,...parts));
  return snap.exists()?snap.data():null;
}
function fbListen(path,cb){
  const {doc,onSnapshot}=window.FS;
  const parts=path.split('/');
  const u=onSnapshot(doc(window.db,...parts),s=>cb(s.exists()?s.data():null));
  listeners.push(u);return u;
}
function stopListeners(){listeners.forEach(u=>u());listeners=[];}

async function checkReset(){
  const today=todayKey();
  const lastDay=gs('last_day','');
  if(lastDay!==today && lastDay!==''){
    // Avant reset : sauvegarder le cumul de chaque moniteur dans Firebase
    const exc=await fbGet('shared/excursions');
    if(exc?.list?.length){
      const monitors=['tim','llorens','munir','nico'];
      for(const mid of monitors){
        const myExc=exc.list.filter(e=>e.monitorId===mid);
        if(myExc.length>0){
          const current=await fbGet('cumuls/'+mid)||{min:0,exc:0,days:0};
          await fbSet('cumuls/'+mid,{
            min:(current.min||0)+myExc.reduce((s,e)=>s+(e.duration||0),0),
            exc:(current.exc||0)+myExc.length,
            days:(current.days||0)+1
          });
        }
      }
      await fbSet('history/'+lastDay,{date:lastDay,excursions:exc.list});
    }
    await fbSet('shared/excursions',{list:[],day:today});
    await fbSet('shared/tasks',{done:[],day:today});
  }
  ss('last_day',today);

  // Ajouter les 2h de Tim du 2026-05-21 si pas encore fait
  const timFix=gs('tim_fix_done','');
  if(!timFix){
    const current=await fbGet('cumuls/tim')||{min:0,exc:0,days:0};
    await fbSet('cumuls/tim',{
      min:(current.min||0)+120,
      exc:(current.exc||0)+1,
      days:(current.days||0)+1
    });
    ss('tim_fix_done','yes');
  }
}

function pp(n){if(pinBuf.length>=4)return;pinBuf+=String(n);updDots();if(pinBuf.length===4)setTimeout(handlePin,200);}
function pdel(){pinBuf=pinBuf.slice(0,-1);updDots();}
function updDots(err=false){document.querySelectorAll('.pin-dot').forEach((d,i)=>{d.classList.remove('filled','error');if(i<pinBuf.length)d.classList.add(err?'error':'filled');});}
function handlePin(){
  const stored=gs('pin_'+me.id);
  if(!stored){
    if(pinStep===1){pinTmp=pinBuf;pinBuf='';pinStep=2;$('pin-hint').textContent=t('pin_confirm');updDots();}
    else{if(pinBuf===pinTmp){ss('pin_'+me.id,pinBuf);toast(t('pin_ok'));enterApp();}else{toast(t('pin_mismatch'));pinTmp='';pinBuf='';pinStep=1;updDots(true);setTimeout(()=>{$('pin-hint').textContent=t('pin_create');updDots();},600);}}
  }else{if(pinBuf===stored){enterApp();}else{toast(t('pin_wrong'));pinBuf='';updDots(true);setTimeout(()=>updDots(),600);}}
}

function enterApp(){
  $('top-av').style.background=me.bg;$('top-av').textContent=me.emoji;
  $('top-nm').textContent=me.name+(me.badge?' '+me.badge:'');
  showScreen('screen-app');applyLang();startListeners();goTab('home');
}

function startListeners(){
  stopListeners();
  fbListen('shared/excursions',d=>{SD.excursions=(d?.list)||[];if(['home','mer','planning'].includes(activeTab))renderTab(activeTab);});
  fbListen('shared/tasks',d=>{SD.tasks_done=(d?.done)||[];if(activeTab==='home')renderTab('home');});
  fbListen('shared/photos',d=>{SD.photos=(d?.list)||[];if(activeTab==='planning')renderTab('planning');});
  fbListen('shared/cartel',d=>{SD.cartel_note=(d?.note)||'';if(activeTab==='planning'&&planTab==='cartel')renderTab('planning');});
  // Cumuls de tous les moniteurs (permanent, Firebase)
  fbListen('cumuls/tim',d=>{if(!SD.cumuls)SD.cumuls={};SD.cumuls.tim=d||{min:0,exc:0,days:0};if(activeTab==='profil')renderTab('profil');});
  fbListen('cumuls/llorens',d=>{if(!SD.cumuls)SD.cumuls={};SD.cumuls.llorens=d||{min:0,exc:0,days:0};if(activeTab==='profil')renderTab('profil');});
  fbListen('cumuls/munir',d=>{if(!SD.cumuls)SD.cumuls={};SD.cumuls.munir=d||{min:0,exc:0,days:0};if(activeTab==='profil')renderTab('profil');});
  fbListen('cumuls/nico',d=>{if(!SD.cumuls)SD.cumuls={};SD.cumuls.nico=d||{min:0,exc:0,days:0};if(activeTab==='profil')renderTab('profil');});
  // messages realtime
  const {collection,onSnapshot,query,orderBy}=window.FS;
  const q=query(collection(window.db,'messages'),orderBy('ts','asc'));
  const u=onSnapshot(q,snap=>{SD.messages=snap.docs.map(d=>({id:d.id,...d.data()}));if(activeTab==='chat')renderTab('chat');});
  listeners.push(u);
}

function goTab(tab){

async function toggleTask(taskKey){

}

        <div style="flex:1">
          <div style="font-size:14px;font-weight:700">${m.name} ${m.badge||''}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${myE.length} sortie${myE.length>1?'s':''} · <span style="color:var(--accent)">${tot===0?'—':fmtTime(tot)}</span></div>
        </div>
        <div style="text-align:right">
          <div class="time-badge" style="${tot===0?'opacity:.35':''}">${tot===0?'—':fmtTime(tot)}</div>
          ${myE.length>0?`<div style="font-size:10px;color:var(--muted);margin-top:4px">${myE.length} 🌊</div>`:''}
        </div>
      </div>`;}).join('')}
  </div>
  ${exc.length>0?`<div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--accent);margin-bottom:10px">Détail</div>`:''}
  ${exc.map((e)=>{const p=PROFILES.find(x=>x.id===e.monitorId);
    return `<div class="exc-card">
      <div class="exc-header">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:38px;height:38px;border-radius:50%;background:${p?p.bg:'#333'};display:flex;align-items:center;justify-content:center;font-size:16px">${p?p.emoji:'🤿'}</div>
          <div><div class="exc-name">${p?p.name:'?'}</div><div class="exc-detail">${e.time}${e.note?' · '+e.note:''}</div></div>
        </div>
        ${isAdmin()?`<button onclick="delExc('${e.id}')" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer">🗑</button>`:''}
      </div>
      <div class="exc-duration">⏱ ${fmtTime(e.duration||0)}</div>
    </div>`;}).join('')}
  ${canAdd?`<button class="add-btn" onclick="openAddExc()">${t('add_exc')}</button>`:''}`;
}

function openAddExc(){
  const monitors=PROFILES.filter(p=>p.cat==='monitor');
  showModal(`<h3>${t('exc_title')}</h3>
    <div class="form-group"><label class="form-label">${t('exc_monitor')}</label>
      <select class="form-select" id="m-mon">${monitors.map(m=>`<option value="${m.id}" ${m.id===me.id?'selected':''}>${m.emoji} ${m.name} ${m.badge||''}</option>`).join('')}</select></div>
    <div class="form-group"><label class="form-label">${t('exc_duration')}</label>
      <select class="form-select" id="m-dur">
        <option value="20">20 min</option>
        <option value="30">30 min</option>
        <option value="40">40 min</option>
        <option value="60" selected>1h</option>
        <option value="120">2h</option>
      </select></div>
    <div class="form-group"><label class="form-label">Note</label>
      <input class="form-input" id="m-note" type="text" placeholder="..."></div>
    <button class="btn-primary" onclick="saveExc()">${t('save')}</button>
    <button class="btn-secondary" onclick="closeModal()">${t('cancel')}</button>`);
}
async function saveExc(){
  const monitorId=$('m-mon').value,duration=parseInt($('m-dur').value),note=$('m-note').value;
  const list=[...SD.excursions,{monitorId,duration,note,time:new Date().toLocaleTimeString().slice(0,5),id:Date.now().toString(),by:me.id}];
  await fbSet('shared/excursions',{list,day:todayKey()});
  closeModal();toast('✅ Excursion ajoutée');
}
async function delExc(id){
  if(!isAdmin()){toast('❌ Réservé aux admins');return;}
  const list=SD.excursions.filter(e=>e.id!==id);
  await fbSet('shared/excursions',{list,day:todayKey()});
}

// ─── PLANNING ──────────────────────────────────────────────
function buildPlanning(){
  const photos=SD.photos;
  return `<div class="section-title">${t('planning')}</div>
  <div class="plan-tabs">
    <button class="plan-tab ${planTab==='cartel'?'active':''}" onclick="setPT('cartel')">${t('tab_cartel')}</button>
    <button class="plan-tab ${planTab==='photos'?'active':''}" onclick="setPT('photos')">${t('tab_photos')}${photos.length?` (${photos.length})`:''}</button>
    <button class="plan-tab ${planTab==='exc'?'active':''}" onclick="setPT('exc')">${t('tab_exc')}</button>
  </div>
  <div id="pt-body">${buildPTBody()}</div>`;
}
function setPT(tab){planTab=tab;const b=$('pt-body');if(b)b.innerHTML=buildPTBody();}
function buildPTBody(){
  if(planTab==='cartel')return `<button class="btn-primary" style="margin-bottom:12px" onclick="openCamera('planning')">${t('take_photo')}</button>
    <div class="cartel-note"><textarea rows="8" id="cartel-ta" placeholder="${t('cartel_hint')}" oninput="saveCartel(this.value)">${SD.cartel_note}</textarea></div>`;
  if(planTab==='photos'){
    const photos=SD.photos;
    return photos.length===0?`<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">${t('no_photos')}</div>`
      :`<div class="photo-grid">${photos.map((p,i)=>`<div style="position:relative"><img src="${p.data}" class="photo-thumb" onclick="viewPhoto(${i})"><div style="position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.75);border-radius:4px;padding:2px 5px;font-size:9px;color:#fff">${p.by} ${p.time}</div>${isAdmin()?`<button onclick="delPhoto(${i})" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:22px;height:22px;color:var(--red);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button>`:''}</div>`).join('')}</div>`;
  }
  if(planTab==='exc'){
    const exc=SD.excursions;
    return exc.length===0?`<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">${t('no_exc')}</div>`
      :exc.map(e=>{const p=PROFILES.find(x=>x.id===e.monitorId);
        return `<div class="exc-card"><div class="exc-header"><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:${p?p.bg:'#333'};display:flex;align-items:center;justify-content:center;font-size:16px">${p?p.emoji:'🤿'}</div><div><div class="exc-name">${p?p.name:'?'}</div><div class="exc-detail">${e.time}${e.note?' · '+e.note:''}</div></div></div>${isAdmin()?`<button onclick="delExc('${e.id}')" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer">🗑</button>`:''}</div><div class="exc-duration">⏱ ${fmtTime(e.duration||0)}</div></div>`;
      }).join('');
  }
}
async function saveCartel(v){await fbSet('shared/cartel',{note:v});}
function viewPhoto(i){const p=SD.photos[i];if(!p)return;showModal(`<img src="${p.data}" style="width:100%;border-radius:10px"><div style="font-size:12px;color:var(--muted);margin-top:8px">📸 ${p.by} — ${p.date}</div>`);}
async function delPhoto(i){
  if(!isAdmin()){toast('❌ Réservé aux admins');return;}
  const list=[...SD.photos];list.splice(i,1);
  await fbSet('shared/photos',{list});
}

// ─── CHAT ──────────────────────────────────────────────────
function buildChatUI(c){
  const msgs=SD.messages;
  c.innerHTML=`<div class="chat-wrap">
    <div class="chat-messages" id="chat-msgs">
      ${msgs.length===0?`<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;margin-top:30px">💬 ${t('no_messages')}</div>`:''}
      ${msgs.map(m=>{const mine=m.uid===me.id;const sender=PROFILES.find(p=>p.id===m.uid);
        if(m.type==='photo')return `<div class="msg ${mine?'mine':'theirs'}">${!mine?`<div class="msg-sender">${sender?.emoji||''} ${m.user}</div>`:''}<img src="${m.data}" class="msg-img"><div class="msg-meta">${m.time}</div></div>`;
        return `<div class="msg ${mine?'mine':'theirs'}">${!mine?`<div class="msg-sender">${sender?.emoji||''} ${m.user}</div>`:''}<div>${m.text}</div><div class="msg-meta">${m.time}</div></div>`;
      }).join('')}
    </div>
    <div class="chat-bar">
      <button class="cam-btn" onclick="openCamera('chat')">📷</button>
      <textarea class="chat-input" id="chat-in" placeholder="${t('type_msg')}" rows="1" onkeydown="chatKey(event)"></textarea>
      <button class="send-btn" onclick="sendMsg()">↑</button>
    </div>
  </div>`;
  const el=$('chat-msgs');if(el)el.scrollTop=el.scrollHeight;
}
function chatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
async function sendMsg(){
  const inp=$('chat-in');const text=(inp?.value||'').trim();if(!text)return;
  const {collection,addDoc,serverTimestamp}=window.FS;
  await addDoc(collection(window.db,'messages'),{uid:me.id,user:me.name,text,time:new Date().toLocaleTimeString().slice(0,5),ts:serverTimestamp()});
  if(inp)inp.value='';
}

// ─── PROFIL ────────────────────────────────────────────────
function buildProfil(){
  const exc=SD.excursions;
  const myMinToday=exc.filter(e=>e.monitorId===me.id).reduce((s,e)=>s+(e.duration||0),0);
  const myExcToday=exc.filter(e=>e.monitorId===me.id).length;
  // Cumul depuis Firebase (jamais reset, permanent)
  const cumul=SD.cumuls?.[me.id]||{min:0,exc:0,days:0};
  const allMin=cumul.min+myMinToday;
  const allExc=cumul.exc+myExcToday;
  const allDays=cumul.days;

  return `<div class="profile-header">
    <div class="profile-big-avatar" style="background:${me.bg}">${me.emoji}</div>
    <div class="profile-big-name">${me.name} ${me.badge||''}</div>
    <div style="color:var(--muted);font-size:13px;margin-top:4px">${me.role}${isAdmin()?` <span class="admin-crown">👑 Admin</span>`:''}</div>
    <div class="profile-stats">
      <div class="pstat"><div class="pstat-num">${fmtTime(allMin)}</div><div class="pstat-label">${t('my_sea')}</div></div>
      <div class="pstat"><div class="pstat-num">${allExc}</div><div class="pstat-label">${t('my_exc')}</div></div>
      <div class="pstat"><div class="pstat-num">${allDays}</div><div class="pstat-label">${t('my_days')}</div></div>
    </div>
  </div>
  <div class="settings-list">
    <div class="setting-row" onclick="openChangePIN()"><span>${t('change_pin')}</span><span style="color:var(--muted)">›</span></div>
    ${isAdmin()?`<div class="setting-row" onclick="openAdmin()"><span>${t('admin_panel')}</span><span style="color:var(--muted)">›</span></div>`:''}
    <div class="setting-row" onclick="openHistory()"><span>${t('history')}</span><span style="color:var(--muted)">›</span></div>
    <div class="setting-row" style="color:var(--red)" onclick="doLogout()"><span>${t('logout')}</span><span style="color:var(--red)">›</span></div>
  </div>`;
}

async function doLogout(){
  // Sauvegarde cumul du jour dans Firebase (permanent, jamais effacé)
  await saveCumulToFirebase();
  stopListeners();me=null;showScreen('screen-select');buildProfiles();
}

async function saveCumulToFirebase(){
  const exc=SD.excursions;
  const myExc=exc.filter(e=>e.monitorId===me.id);
  const today=todayKey();
  const lastSaved=gs('cumul_saved_day_'+me.id,'');
  if(myExc.length>0 && lastSaved!==today){
    const current=SD.cumuls?.[me.id]||{min:0,exc:0,days:0};
    const updated={
      min:(current.min||0)+myExc.reduce((s,e)=>s+(e.duration||0),0),
      exc:(current.exc||0)+myExc.length,
      days:(current.days||0)+1
    };
    await fbSet('cumuls/'+me.id, updated);
    ss('cumul_saved_day_'+me.id, today);
  }
}

function openHistory(){
  const cumul=SD.cumuls?.[me.id]||{min:0,exc:0,days:0};
  const exc=SD.excursions;
  const myMinToday=exc.filter(e=>e.monitorId===me.id).reduce((s,e)=>s+(e.duration||0),0);
  const myExcToday=exc.filter(e=>e.monitorId===me.id).length;
  const totalMin=(cumul.min||0)+myMinToday;
  const totalExc=(cumul.exc||0)+myExcToday;
  const totalDays=(cumul.days||0);
  showModal(`<h3>${t('history')}</h3>
    <div style="background:var(--bg3);border-radius:12px;padding:20px;text-align:center;margin-bottom:16px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--accent)">${fmtTime(totalMin)}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:4px">${t('my_sea')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
        <div style="background:var(--card);border-radius:10px;padding:12px">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent)">${totalExc}</div>
          <div style="font-size:11px;color:var(--muted)">${t('my_exc')}</div>
        </div>
        <div style="background:var(--card);border-radius:10px;padding:12px">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent)">${totalDays}</div>
          <div style="font-size:11px;color:var(--muted)">${t('my_days')}</div>
        </div>
      </div>
    </div>
    <div style="color:var(--muted);font-size:12px;text-align:center">Cumul sauvegardé depuis le début de la saison 🌊</div>`);
}

function openAdmin(){
  showModal(`<h3>${t('admin_panel')}</h3>
    <button class="btn-danger" onclick="adminReset()">${t('admin_reset')}</button>
    <button class="btn-secondary" onclick="adminClrChat()">${t('admin_clr_chat')}</button>
    <button class="btn-secondary" onclick="adminClrPhotos()">${t('admin_clr_photos')}</button>
    <button class="btn-secondary" onclick="closeModal()">${t('cancel')}</button>`);
}
async function adminReset(){
  if(!isAdmin()){toast('❌ Réservé aux admins');return;}
  const exc=SD.excursions;
  if(exc.length){const today=todayKey();await fbSet('history/'+today,{entries:[{date:today,excursions:exc}]});}
  await fbSet('shared/excursions',{list:[],day:todayKey()});
  await fbSet('shared/tasks',{done:[],day:todayKey()});
  closeModal();toast('✅ Reset effectué');
}
async function adminClrChat(){
  if(!isAdmin()){toast('❌ Réservé aux admins');return;}
  const {collection,getDocs,deleteDoc}=window.FS;
  const snap=await getDocs(collection(window.db,'messages'));
  for(const d of snap.docs)await deleteDoc(d.ref);
  closeModal();toast('✅ Chat effacé');
}
async function adminClrPhotos(){
  if(!isAdmin()){toast('❌ Réservé aux admins');return;}
  await fbSet('shared/photos',{list:[]});
  closeModal();toast('✅ Photos effacées');
}

function openChangePIN(){
  let step=1,first='';
  showModal(`<h3>${t('change_pin')}</h3>
    <div id="cp-hint" style="color:var(--muted);font-size:13px;margin-bottom:16px">${t('new_pin')}</div>
    <div style="display:flex;gap:14px;justify-content:center;margin-bottom:20px">
      ${[0,1,2,3].map(i=>`<div class="pin-dot" id="cpd${i}"></div>`).join('')}
    </div>
    <div class="numpad" style="margin:0 auto">
      ${[1,2,3,4,5,6,7,8,9,'＊',0,'⌫'].map(n=>`<button class="num-btn" onclick="cpP('${n}')">${n}</button>`).join('')}
    </div>`);
  window._cp={step,buf:'',first};
}
function cpP(n){
  const s=window._cp;if(!s)return;
  if(n==='⌫')s.buf=s.buf.slice(0,-1);
  else if(n!=='＊'&&s.buf.length<4)s.buf+=String(n);
  [0,1,2,3].forEach(i=>{const d=$('cpd'+i);if(d)d.classList.toggle('filled',i<s.buf.length);});
  if(s.buf.length===4){setTimeout(()=>{
    if(s.step===1){s.first=s.buf;s.buf='';s.step=2;$('cp-hint').textContent=t('confirm_new_pin');[0,1,2,3].forEach(i=>{const d=$('cpd'+i);if(d)d.classList.remove('filled');});}
    else{if(s.buf===s.first){ss('pin_'+me.id,s.buf);closeModal();toast(t('pin_changed'));}else{toast(t('pin_mismatch'));s.step=1;s.buf='';s.first='';[0,1,2,3].forEach(i=>{const d=$('cpd'+i);if(d)d.classList.remove('filled');});}}
  },200);}
}

// ─── CAMERA ────────────────────────────────────────────────
async function openCamera(target){
  camTarget=target;$('camera-modal').classList.add('show');
  try{
    if(camStream)camStream.getTracks().forEach(t=>t.stop());
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode},audio:false});
    $('camera-video').srcObject=camStream;
  }catch(e){$('camera-modal').classList.remove('show');toast(t('cam_err'));}
}
function closeCamera(){if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null;$('camera-modal').classList.remove('show');}
function switchCam(){facingMode=facingMode==='environment'?'user':'environment';openCamera(camTarget);}
async function capturePhoto(){
  const v=$('camera-video'),cv=$('camera-canvas');
  cv.width=v.videoWidth;cv.height=v.videoHeight;
  cv.getContext('2d').drawImage(v,0,0);
  const data=cv.toDataURL('image/jpeg',0.6);
  const now=new Date();
  closeCamera();
  if(camTarget==='chat'){
    const {collection,addDoc,serverTimestamp}=window.FS;
    await addDoc(collection(window.db,'messages'),{uid:me.id,user:me.name,type:'photo',data,time:now.toLocaleTimeString().slice(0,5),ts:serverTimestamp()});
    goTab('chat');
  }else{
    const list=[{data,by:me.name,time:now.toLocaleTimeString().slice(0,5),date:now.toLocaleDateString(),uid:me.id},...(SD.photos||[])];
    await fbSet('shared/photos',{list});
    planTab='photos';goTab('planning');
  }
  toast(t('photo_sent'));
}

function showModal(html){$('modal-c').innerHTML=`<button class="modal-close" onclick="closeModal()">×</button>${html}`;$('modal-ov').classList.add('show');}
function closeModal(){$('modal-ov').classList.remove('show');window._cp=null;}
function ovClick(e){if(e.target===$('modal-ov'))closeModal();}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}
</script>
</body>
</html>
