
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JST Salou</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10;--bg2:#12151c;--bg3:#1a1e28;--card:#1e2330;
  --accent:#00c8ff;--accent2:#ff6b35;--gold:#ffc947;
  --text:#e8eaf0;--muted:#6b7280;--border:#2a2f3d;
  --green:#22c55e;--red:#ef4444;--purple:#a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
/* LOADING */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s;}
#splash.hide{opacity:0;pointer-events:none;}
.splash-logo{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:4px;color:var(--accent);text-shadow:0 0 40px rgba(0,200,255,.4);}
.splash-sub{color:var(--muted);font-size:14px;letter-spacing:6px;margin-top:4px;}
.splash-wave{font-size:48px;margin-bottom:20px;animation:bob 1.5s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* SCREENS */
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;flex-direction:column;}

/* PROFILE SELECT */
#screen-select{padding:20px;background:var(--bg);}
.select-header{text-align:center;padding:30px 0 24px;}
.select-header h1{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--accent);letter-spacing:3px;}
.select-header p{color:var(--muted);font-size:13px;margin-top:4px;}
.lang-bar{display:flex;justify-content:center;gap:8px;margin-bottom:24px;}
.lang-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:12px;cursor:pointer;transition:.2s;}
.lang-btn.active{border-color:var(--accent);color:var(--accent);}
.section-label{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:16px 0 10px;}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:.2s;position:relative;}
.profile-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.profile-card.selected{border-color:var(--accent);background:rgba(0,200,255,.08);}
.p-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 8px;}
.p-name{font-size:13px;font-weight:600;}
.p-role{font-size:10px;color:var(--muted);margin-top:2px;}
.p-badge{position:absolute;top:6px;right:6px;font-size:12px;}
.patron-card .p-avatar{background:linear-gradient(135deg,var(--gold),var(--accent2));}
.chef-card .p-avatar{background:linear-gradient(135deg,var(--accent2),#ff3b6b);}
.cabine-card .p-avatar{background:linear-gradient(135deg,var(--purple),#ec4899);}
.monitor-card .p-avatar{background:linear-gradient(135deg,var(--green),var(--accent));}

/* PIN */
#screen-pin{padding:20px;align-items:center;justify-content:center;flex-direction:column;background:var(--bg);}
.pin-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;box-shadow:0 0 30px rgba(0,200,255,.3);}
.pin-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:4px;}
.pin-hint{color:var(--muted);font-size:13px;margin-bottom:32px;}
.pin-dots{display:flex;gap:16px;margin-bottom:32px;}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:.2s;}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(0,200,255,.5);}
.pin-dot.error{background:var(--red);border-color:var(--red);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:240px;}
.num-btn{height:60px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:22px;font-weight:600;cursor:pointer;transition:.2s;}
.num-btn:hover{background:var(--bg3);border-color:var(--accent);}
.num-btn.del{font-size:16px;color:var(--muted);}
.back-btn{margin-top:20px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:8px;}

/* TOP NAV */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent);letter-spacing:2px;}
.topbar-user{display:flex;align-items:center;gap:8px;cursor:pointer;}
.topbar-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:14px;}
.topbar-name{font-size:13px;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.lang-mini{display:flex;gap:4px;}
.lang-mini button{background:none;border:none;font-size:12px;color:var(--muted);cursor:pointer;padding:2px 4px;}
.lang-mini button.active{color:var(--accent);}

/* BOTTOM NAV */
.bottom-nav{background:var(--bg2);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0 10px;position:sticky;bottom:0;z-index:100;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 4px;border:none;background:none;color:var(--muted);transition:.2s;}
.nav-item.active{color:var(--accent);}
.nav-icon{font-size:20px;}
.nav-label{font-size:9px;letter-spacing:.5px;}
.nav-item.active .nav-icon{filter:drop-shadow(0 0 6px var(--accent));}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:16px;}

/* DASHBOARD */
.greeting{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;margin-bottom:4px;}
.greeting span{color:var(--accent);}
.date-bar{font-size:12px;color:var(--muted);margin-bottom:20px;}
.weather-card{background:linear-gradient(135deg,#0f3460,#1a1e28);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.weather-main{display:flex;align-items:center;gap:12px;}
.weather-icon{font-size:40px;}
.weather-temp{font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--accent);}
.weather-info{font-size:12px;color:var(--muted);}
.weather-city{font-size:14px;font-weight:600;color:var(--text);}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.card-title{font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.tasks-list{}
.task-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.task-item:last-child{border-bottom:none;}
.task-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.2s;}
.task-check.done{background:var(--green);border-color:var(--green);}
.task-text{font-size:13px;flex:1;}
.task-text.done{text-decoration:line-through;color:var(--muted);}
.task-assign{font-size:10px;color:var(--accent);}

/* HORAIRES */
.sea-timeline{display:flex;flex-direction:column;gap:8px;}
.sea-slot{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:space-between;}
.sea-slot.active{border-color:var(--accent);background:rgba(0,200,255,.05);}
.sea-time{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);}
.sea-info{flex:1;margin-left:12px;}
.sea-type{font-size:13px;font-weight:600;}
.sea-clients{font-size:11px;color:var(--muted);margin-top:2px;}
.sea-status{font-size:10px;padding:3px 8px;border-radius:10px;background:rgba(34,197,94,.15);color:var(--green);}
.sea-status.pending{background:rgba(255,107,53,.15);color:var(--accent2);}
.add-btn{width:100%;padding:12px;border-radius:12px;border:1px dashed var(--border);background:none;color:var(--muted);font-size:13px;cursor:pointer;margin-top:10px;transition:.2s;}
.add-btn:hover{border-color:var(--accent);color:var(--accent);}

/* CHAT */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 160px);}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.msg{max-width:75%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.4;}
.msg.mine{background:var(--accent);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px;}
.msg.theirs{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px;}
.msg-meta{font-size:10px;color:var(--muted);margin-top:3px;}
.msg.mine .msg-meta{text-align:right;}
.msg-sender{font-weight:700;font-size:11px;margin-bottom:3px;}
.chat-input-bar{padding:10px 12px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;}
.chat-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:10px 14px;color:var(--text);font-size:13px;resize:none;max-height:100px;font-family:'DM Sans',sans-serif;}
.chat-input:focus{outline:none;border-color:var(--accent);}
.send-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);border:none;color:var(--bg);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cam-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.msg-img{max-width:200px;border-radius:10px;margin-top:6px;}

/* PLANNING */
.planning-header{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
.plan-tab{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;white-space:nowrap;cursor:pointer;}
.plan-tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.resa-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
.resa-top{display:flex;justify-content:space-between;align-items:flex-start;}
.resa-name{font-weight:700;font-size:15px;}
.resa-time{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);}
.resa-details{font-size:12px;color:var(--muted);margin-top:6px;}
.resa-badge{font-size:10px;padding:3px 10px;border-radius:10px;}
.resa-badge.confirmed{background:rgba(34,197,94,.15);color:var(--green);}
.resa-badge.pending{background:rgba(255,107,53,.15);color:var(--accent2);}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;}
.photo-thumb{aspect-ratio:1;border-radius:8px;object-fit:cover;width:100%;background:var(--bg3);cursor:pointer;}

/* PROFIL */
.profile-header{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-radius:16px;padding:20px;margin-bottom:14px;text-align:center;}
.profile-big-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;box-shadow:0 0 30px rgba(0,200,255,.3);}
.profile-big-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;}
.profile-big-role{color:var(--muted);font-size:13px;margin-top:2px;}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.pstat{text-align:center;}
.pstat-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);}
.pstat-label{font-size:10px;color:var(--muted);}
.settings-list{display:flex;flex-direction:column;gap:6px;}
.setting-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.setting-row:hover{border-color:var(--accent);}
.setting-label{font-size:14px;}
.setting-arrow{color:var(--muted);font-size:16px;}
.history-entry{padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;}
.history-entry:last-child{border-bottom:none;}
.history-date{color:var(--accent);font-size:10px;margin-bottom:2px;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;align-items:flex-end;padding:0;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;margin-bottom:16px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block;}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;}
.form-input:focus{outline:none;border-color:var(--accent);}
.form-select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;appearance:none;}
.btn-primary{width:100%;padding:14px;border-radius:12px;background:var(--accent);border:none;color:var(--bg);font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
.btn-danger{width:100%;padding:14px;border-radius:12px;background:rgba(239,68,68,.15);border:1px solid var(--red);color:var(--red);font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
.btn-secondary{width:100%;padding:14px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:15px;cursor:pointer;margin-top:8px;}
.modal-close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;}

/* CAMERA */
#camera-modal{position:fixed;inset:0;background:#000;z-index:600;display:none;flex-direction:column;}
#camera-modal.show{display:flex;}
#camera-video{width:100%;flex:1;object-fit:cover;}
.camera-bar{padding:20px;display:flex;justify-content:center;gap:24px;align-items:center;background:#000;}
.cam-capture{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;}
.cam-cancel{width:44px;height:44px;border-radius:50%;border:2px solid var(--muted);background:none;color:var(--muted);font-size:18px;cursor:pointer;}
#camera-canvas{display:none;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:10px 20px;font-size:13px;z-index:1000;opacity:0;transition:.3s;pointer-events:none;}
.toast.show{opacity:1;}

/* ADMIN BADGE */
.admin-crown{font-size:10px;background:rgba(255,201,71,.15);color:var(--gold);padding:2px 6px;border-radius:8px;margin-left:6px;}

/* RESPONSIVE */
@media(max-width:360px){
  .profile-grid{grid-template-columns:repeat(2,1fr);}
  .stats-row{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-wave">🌊</div>
  <div class="splash-logo">JST SALOU</div>
  <div class="splash-sub">JET SKI TEAM</div>
</div>

<!-- PROFILE SELECT -->
<div id="screen-select" class="screen">
  <div class="select-header">
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
      <button class="lang-btn" onclick="setLang('es')">🇪🇸 ES</button>
      <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
    </div>
    <div class="splash-wave" style="font-size:32px;margin-bottom:8px;">🌊</div>
    <h1>JST SALOU</h1>
    <p data-t="select_profile">Sélectionne ton profil</p>
  </div>

  <div style="padding:0 16px 100px;">
    <div class="section-label" data-t="patrons">Patrons</div>
    <div class="profile-grid" id="patrons-grid"></div>

    <div class="section-label" data-t="chefs">Chefs d'équipe</div>
    <div class="profile-grid" id="chefs-grid"></div>

    <div class="section-label" data-t="moniteurs">Moniteurs</div>
    <div class="profile-grid" id="moniteurs-grid"></div>

    <div class="section-label" data-t="cabine">Cabine</div>
    <div class="profile-grid" id="cabine-grid"></div>

    <button class="btn-primary" id="select-confirm" style="display:none;" onclick="confirmProfile()" data-t="confirm">Confirmer</button>
  </div>
</div>

<!-- PIN -->
<div id="screen-pin" class="screen">
  <div style="text-align:center;width:100%;max-width:320px;padding:20px;">
    <div class="pin-avatar" id="pin-avatar">😊</div>
    <div class="pin-name" id="pin-name">-</div>
    <div class="pin-hint" id="pin-hint" data-t="enter_pin">Entrez votre code PIN</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot"></div><div class="pin-dot"></div>
      <div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="numpad">
      <button class="num-btn" onclick="pinPress(1)">1</button>
      <button class="num-btn" onclick="pinPress(2)">2</button>
      <button class="num-btn" onclick="pinPress(3)">3</button>
      <button class="num-btn" onclick="pinPress(4)">4</button>
      <button class="num-btn" onclick="pinPress(5)">5</button>
      <button class="num-btn" onclick="pinPress(6)">6</button>
      <button class="num-btn" onclick="pinPress(7)">7</button>
      <button class="num-btn" onclick="pinPress(8)">8</button>
      <button class="num-btn" onclick="pinPress(9)">9</button>
      <button class="num-btn" onclick="pinPress('')">＊</button>
      <button class="num-btn" onclick="pinPress(0)">0</button>
      <button class="num-btn del" onclick="pinDel()">⌫</button>
    </div>
    <button class="back-btn" onclick="goToSelect()" data-t="back">← Retour</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="screen-app" class="screen">
  <div class="topbar">
    <div class="topbar-logo">⛵ JST</div>
    <div class="topbar-right">
      <div class="lang-mini">
        <button onclick="setLang('fr')" class="active" id="lbtn-fr">FR</button>
        <button onclick="setLang('es')" id="lbtn-es">ES</button>
        <button onclick="setLang('en')" id="lbtn-en">EN</button>
      </div>
      <div class="topbar-user" onclick="goTab('profil')">
        <div class="topbar-avatar" id="top-avatar">😊</div>
        <span class="topbar-name" id="top-name">-</span>
      </div>
    </div>
  </div>

  <div class="content" id="main-content"><!-- dynamic --></div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="goTab('home')">
      <div class="nav-icon">🏠</div>
      <div class="nav-label" data-t="home">Home</div>
    </button>
    <button class="nav-item" onclick="goTab('horaires')">
      <div class="nav-icon">🌊</div>
      <div class="nav-label" data-t="sea">Mer</div>
    </button>
    <button class="nav-item" onclick="goTab('planning')">
      <div class="nav-icon">📋</div>
      <div class="nav-label" data-t="planning">Planning</div>
    </button>
    <button class="nav-item" onclick="goTab('chat')">
      <div class="nav-icon">💬</div>
      <div class="nav-label" data-t="chat">Chat</div>
    </button>
    <button class="nav-item" onclick="goTab('profil')">
      <div class="nav-icon">👤</div>
      <div class="nav-label" data-t="profile">Profil</div>
    </button>
  </div>
</div>

<!-- CAMERA -->
<div id="camera-modal">

function t(key){return (TRANSLATIONS[currentLang]||TRANSLATIONS.fr)[key]||key;}

// =================== STORAGE ===================
function getStore(key,def=null){
  try{const v=localStorage.getItem('jst_'+key);return v?JSON.parse(v):def;}catch{return def;}
}
function setStore(key,val){
  try{localStorage.setItem('jst_'+key,JSON.stringify(val));}catch{}
}

function getShared(key,def=null){return getStore('shared_'+key,def);}
function setShared(key,val){
  setStore('shared_'+key,val);
  // broadcast to same tab
  window.dispatchEvent(new CustomEvent('jst_update',{detail:{key}}));
}

// =================== INIT ===================
window.addEventListener('load',()=>{
  checkDailyReset();
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
    setTimeout(()=>{
      document.getElementById('splash').style.display='none';
      showScreen('screen-select');
      renderProfileSelect();
      applyLang();
    },600);
  },1800);
});

function checkDailyReset(){
  const today = new Date().toDateString();
  const last = getStore('last_day','');
  if(last !== today){
    // Archive today's data before reset
    const sessions = getShared('sessions',[]);
    const todayDate = last || today;
    if(sessions.length>0){
      const allHistory = getShared('sessions_history',[]);
      allHistory.push({date:todayDate,sessions});
      setShared('sessions_history',allHistory);
    }
    setShared('sessions',[]);
    setShared('tasks_done',[]);
    setStore('last_day',today);
  }
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setLang(lang){
  currentLang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const key=el.getAttribute('data-t');
    el.textContent=t(key);
  });
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.lang-mini button').forEach(b=>b.classList.remove('active'));
  const sel=document.querySelector(`.lang-btn:nth-child(${lang==='fr'?1:lang==='es'?2:3})`);
  if(sel)sel.classList.add('active');
  document.getElementById(`lbtn-${lang}`)?.classList.add('active');
  if(activeTab) renderTab(activeTab);
}

function applyLang(){
  document.querySelectorAll('[data-t]').forEach(el=>{

// =================== PROFILE SELECT ===================
function renderProfileSelect(){
  const cats={patron:'patrons-grid',chef:'chefs-grid',monitor:'moniteurs-grid',cabine:'cabine-grid'};
  Object.entries(cats).forEach(([cat,gridId])=>{
    const grid=document.getElementById(gridId);
    grid.innerHTML='';
    PROFILES.filter(p=>p.category===cat).forEach(p=>{
      const div=document.createElement('div');
      div.className=`profile-card ${cat}-card`;
      div.id=`pcard-${p.id}`;
      div.onclick=()=>selectProfile(p.id);
      div.innerHTML=`
        ${p.badge?`<div class="p-badge">${p.badge}</div>`:''}
        ${p.admin?`<div class="p-badge" style="right:auto;left:6px;font-size:9px;background:rgba(255,201,71,.15);color:var(--gold);padding:2px 4px;border-radius:6px;">👑</div>`:''}
        <div class="p-avatar">${p.emoji}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-role">${t(cat==='patron'?'patrons':cat==='chef'?'chefs':cat==='monitor'?'moniteurs':'cabine').replace(/s$/,'')}</div>
      `;
      grid.appendChild(div);
    });
  });
}

let selectedProfileId=null;
function selectProfile(id){
  document.querySelectorAll('.profile-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById(`pcard-${id}`)?.classList.add('selected');
  selectedProfileId=id;
  document.getElementById('select-confirm').style.display='block';
}

function confirmProfile(){
  if(!selectedProfileId)return;
  const profile=PROFILES.find(p=>p.id===selectedProfileId);
  currentUser=profile;
  // Check if user has a pin
  const pin=getStore(`pin_${profile.id}`,null);
  setupPinScreen(!!pin, pin ? 'enter' : 'set');
  showScreen('screen-pin');
}

function setupPinScreen(hasPin, mode){
  isSettingPin = !hasPin;
  pinBuffer='';
  newPinTemp='';
  document.getElementById('pin-avatar').textContent=currentUser.emoji;
  document.getElementById('pin-name').textContent=currentUser.name;
  document.getElementById('pin-hint').textContent=hasPin?t('enter_pin'):t('pin_set').replace('PIN créé ! Bienvenue 🤿','Entre un code PIN à 4 chiffres').replace('¡PIN creado! Bienvenido 🤿','').replace('PIN created! Welcome 🤿','')+(hasPin?'':' — Nouveau code');
  if(!hasPin)document.getElementById('pin-hint').textContent='Crée ton code PIN (4 chiffres)';
  updateDots();
}

function goToSelect(){showScreen('screen-select');renderProfileSelect();}

// =================== PIN ===================
function pinPress(n){
  if(pinBuffer.length>=4)return;
  pinBuffer+=String(n);
  updateDots();
  if(pinBuffer.length===4) setTimeout(checkPin,200);
}
function pinDel(){pinBuffer=pinBuffer.slice(0,-1);updateDots();}
function updateDots(err=false){
  const dots=document.querySelectorAll('.pin-dot');
  dots.forEach((d,i)=>{
    d.classList.remove('filled','error');
    if(i<pinBuffer.length) d.classList.add(err?'error':'filled');
  });
}
function checkPin(){
  const storedPin=getStore(`pin_${currentUser.id}`,null);
  if(!storedPin){
    // First time: set pin
    if(!newPinTemp){
      newPinTemp=pinBuffer;pinBuffer='';
      document.getElementById('pin-hint').textContent='Confirme ton code PIN';
      updateDots();return;
    }
    if(newPinTemp===pinBuffer){
      setStore(`pin_${currentUser.id}`,pinBuffer);
      showToast(t('pin_set'));
      enterApp();
    } else {
      showToast(t('pin_mismatch'));
      newPinTemp='';pinBuffer='';updateDots(true);
      setTimeout(()=>updateDots(),600);
      document.getElementById('pin-hint').textContent='Crée ton code PIN (4 chiffres)';
    }
  } else {
    if(pinBuffer===storedPin){enterApp();}
    else{
      updateDots(true);
      showToast(t('pin_wrong'));
      setTimeout(()=>{pinBuffer='';updateDots();},600);
    }
  }
}
function enterApp(){
  document.getElementById('top-avatar').textContent=currentUser.emoji;
  document.getElementById('top-name').textContent=currentUser.name+(currentUser.admin?'':'')+currentUser.badge||currentUser.name;
  document.getElementById('top-name').textContent=currentUser.name;
  showScreen('screen-app');
  goTab('home');
  // Apply lang mini buttons
  document.getElementById(`lbtn-${currentLang}`)?.classList.add('active');
}

// =================== NAVIGATION ===================
function goTab(tab){
  activeTab=tab;
  document.querySelectorAll('.nav-item').forEach((b,i)=>{
    const tabs=['home','horaires','planning','chat','profil'];
    b.classList.toggle('active',tabs[i]===tab);
  });
  renderTab(tab);
}

function renderTab(tab){
  const c=document.getElementById('main-content');
  if(tab==='home') c.innerHTML=renderHome();
  else if(tab==='horaires') c.innerHTML=renderHoraires();
  else if(tab==='planning') c.innerHTML=renderPlanning();
  else if(tab==='chat') renderChatTab();
  else if(tab==='profil') c.innerHTML=renderProfil();
}

// =================== HOME ===================
function renderHome(){
  const hour=new Date().getHours();
  const greet=hour<12?t('good_morning'):hour<18?t('good_afternoon'):t('good_evening');
  const now=new Date();
  const dateStr=now.toLocaleDateString(currentLang==='fr'?'fr-FR':currentLang==='es'?'es-ES':'en-GB',{weekday:'long',day:'numeric',month:'long'});
  const sessions=getShared('sessions',[]);
  const totalClients=sessions.reduce((s,x)=>s+(x.clients||0),0);
  const tasksDone=getShared('tasks_done',[]);
  const dayIdx=now.getDay();
  const tasks=DAILY_TASKS[dayIdx]||DAILY_TASKS[0];
  const monitorIds=['tim','llorens','munir','nico'];
  const isMonitor=monitorIds.includes(currentUser.id);
  
  let tasksHtml='';
  if(isMonitor){
    tasksHtml=`<div class="card">
      <div class="card-title">${t('today_tasks')} <span style="color:var(--accent2)">${tasksDone.length}/${tasks.length}</span></div>
      <div class="tasks-list">
        ${tasks.map(task=>{
          const done=tasksDone.includes(task.id);
          const assignee=PROFILES.find(p=>p.id===task.assign);
          return `<div class="task-item" onclick="toggleTask('${task.id}')">
            <div class="task-check ${done?'done':''}">✓</div>
            <div>
              <div class="task-text ${done?'done':''}">${task.text}</div>
              <div class="task-assign">${assignee?assignee.emoji+' '+assignee.name:''}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // Weather placeholder (Salou coordinates)
  const weathers=['☀️','⛅','🌤️'];
  const wIcon=weathers[dayIdx%3];

  return `
    <div class="greeting">${greet}, <span>${currentUser.name}</span>
      ${currentUser.badge?`<span style="font-size:20px">${currentUser.badge}</span>`:''}
      ${currentUser.admin?`<span class="admin-crown">👑 ${t('admin_label')}</span>`:''}
    </div>
    <div class="date-bar">${dateStr} — Salou, España</div>

    <div class="weather-card">
      <div class="weather-main">
        <div class="weather-icon">${wIcon}</div>
        <div>
          <div class="weather-city">Salou</div>
          <div class="weather-info">Costa Daurada</div>
        </div>
      </div>
      <div class="weather-temp">${26+dayIdx%4}°</div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num">${sessions.length}</div>
        <div class="stat-label">${t('sessions_today')}</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${totalClients}</div>
        <div class="stat-label">${t('clients_today')}</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${sessions.length*2}</div>
        <div class="stat-label">${t('hours_today')}</div>
      </div>
    </div>

    ${tasksHtml}

    <div class="card">
      <div class="card-title">${t('sea_sessions')}</div>
      ${sessions.slice(-3).map(s=>`
        <div class="sea-slot">
          <div class="sea-time">${s.time}</div>
          <div class="sea-info">
            <div class="sea-type">${s.type}</div>
            <div class="sea-clients">${s.clients} ${t('clients')} · ${s.jets||1} ${t('jets')}</div>
          </div>
          <div class="sea-status">${s.status||'OK'}</div>
        </div>
      `).join('')}
      ${sessions.length===0?`<div style="color:var(--muted);font-size:13px;text-align:center;padding:12px">${t('no_sessions')}</div>`:''}
    </div>
  `;
}

function toggleTask(id){
  const done=getShared('tasks_done',[]);
  const idx=done.indexOf(id);
  if(idx>=0) done.splice(idx,1); else done.push(id);
  setShared('tasks_done',done);
  renderTab('home');
}

// =================== HORAIRES ===================
function renderHoraires(){
  const sessions=getShared('sessions',[]);
  const isAdmin=currentUser.admin||['lucas','ema','nacho','miha'].includes(currentUser.id);
  
  return `
    <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:4px;color:var(--accent)">${t('sea_sessions')}</div>
    <div style="color:var(--muted);font-size:12px;margin-bottom:16px">${new Date().toLocaleDateString(currentLang==='fr'?'fr-FR':currentLang==='es'?'es-ES':'en-GB',{weekday:'long',day:'numeric',month:'long'})}</div>
    
    <div class="sea-timeline" id="sessions-list">
      ${sessions.length===0?`<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">${t('no_sessions')}</div>`:''}
      ${sessions.map((s,i)=>`
        <div class="sea-slot ${s.status==='active'?'active':''}">
          <div class="sea-time">${s.time}</div>
          <div class="sea-info">
            <div class="sea-type">${s.type}</div>
            <div class="sea-clients">${s.clients} ${t('clients')} · ${s.jets||1} ${t('jets')}</div>
            ${s.notes?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${s.notes}</div>`:''}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            <div class="sea-status ${s.status==='pending'?'pending':''}">${s.status==='pending'?t('pending_label')||'⏳':'✓'}</div>
            ${isAdmin?`<button onclick="deleteSession(${i})" style="background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;">🗑</button>`:''}
          </div>
        </div>
      `).join('')}
    </div>
    
    ${isAdmin||currentUser.category==='monitor'?`<button class="add-btn" onclick="openAddSession()">${t('add_session')}</button>`:''}
  `;
}

function deleteSession(i){
  const sessions=getShared('sessions',[]);
  sessions.splice(i,1);setShared('sessions',sessions);
  renderTab('horaires');
}

function saveSession(){

// =================== CHAT ===================
function renderChatTab(){
  const c=document.getElementById('main-content');
  const msgs=getShared('messages',[]);
  c.innerHTML=`
    <div class="chat-container">
      <div class="chat-messages" id="chat-msgs">
        ${msgs.length===0?`<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">${t('no_messages')}</div>`:''}
        ${msgs.map(m=>{
          const isMine=m.userId===currentUser.id;
          const sender=PROFILES.find(p=>p.id===m.userId);
          if(m.type==='photo'){
            return `<div class="msg ${isMine?'mine':'theirs'}">
              ${!isMine?`<div class="msg-sender">${sender?.emoji||''} ${m.user}</div>`:''}
              <img src="${m.data}" class="msg-img">
              <div class="msg-meta">${m.time}</div>
            </div>`;
          }
          return `<div class="msg ${isMine?'mine':'theirs'}">
            ${!isMine?`<div class="msg-sender">${sender?.emoji||''} ${m.user}</div>`:''}
            <div>${m.text}</div>
            <div class="msg-meta">${m.time}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="chat-input-bar">
        <button class="cam-btn" onclick="openCamera('chat')">📷</button>
        <textarea class="chat-input" id="chat-input" placeholder="${t('type_message')}" rows="1" onkeydown="chatKey(event)"></textarea>
        <button class="send-btn" onclick="sendMsg()">↑</button>
      </div>
    </div>
  `;
  const msgs_el=document.getElementById('chat-msgs');
  if(msgs_el) msgs_el.scrollTop=msgs_el.scrollHeight;
}

function chatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}

function sendMsg(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text)return;
  const msgs=getShared('messages',[]);
  msgs.push({userId:currentUser.id,user:currentUser.name,text,time:new Date().toLocaleTimeString().slice(0,5),date:new Date().toISOString()});
  setShared('messages',msgs);
  input.value='';
  renderChatTab();
}

function openChangePIN(){
  let step=1,pin1='';
  showModal(`
    <h3>🔐 ${t('change_pin')}</h3>
    <div id="pin-modal-hint" style="color:var(--muted);font-size:13px;margin-bottom:16px">${t('new_pin')}</div>
    <div style="display:flex;gap:12px;justify-content:center;margin-bottom:20px" id="pin-modal-dots">
      <div class="pin-dot" id="pmd0"></div><div class="pin-dot" id="pmd1"></div>
      <div class="pin-dot" id="pmd2"></div><div class="pin-dot" id="pmd3"></div>
    </div>
    <div class="numpad" style="margin:0 auto">
      ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>`<button class="num-btn ${n==='⌫'?'del':''}" onclick="pinModalPress('${n}')">${n}</button>`).join('')}
    </div>
  `);
  window._pinModal={step,buf:'',pin1};
  window._pinModalCb=(buf)=>{
    const s=window._pinModal;
    if(!s)return;
    if(s.step===1){s.pin1=buf;s.step=2;s.buf='';
      document.getElementById('pin-modal-hint').textContent=t('confirm_pin');
      for(let i=0;i<4;i++){const d=document.getElementById(`pmd${i}`);if(d){d.classList.remove('filled');}}
    }else{
      if(buf===s.pin1){
        setStore(`pin_${currentUser.id}`,buf);
        closeModal();showToast(t('pin_changed'));
      }else{showToast(t('pin_mismatch'));s.step=1;s.buf='';s.pin1='';
        document.getElementById('pin-modal-hint').textContent=t('new_pin');
        for(let i=0;i<4;i++){const d=document.getElementById(`pmd${i}`);if(d){d.classList.remove('filled','error');d.classList.add('error');}}
        setTimeout(()=>{for(let i=0;i<4;i++){const d=document.getElementById(`pmd${i}`);if(d){d.classList.remove('error');}}},600);
      }
    }
  };
}

function pinModalPress(n){
  const s=window._pinModal;if(!s)return;
  if(n==='⌫'){s.buf=s.buf.slice(0,-1);}
  else if(s.buf.length<4){s.buf+=String(n);}
  for(let i=0;i<4;i++){const d=document.getElementById(`pmd${i}`);if(d){d.classList.toggle('filled',i<s.buf.length);}}
  if(s.buf.length===4)setTimeout(()=>window._pinModalCb&&window._pinModalCb(s.buf),200);
}

function openAdminPanel(){

function adminResetDay(){
  const sessions=getShared('sessions',[]);

  if(sessions.length>0){
    const allHistory=getShared('sessions_history',[]);
    allHistory.push({date:today,sessions});setShared('sessions_history',allHistory);
  }
  setShared('sessions',[]);setShared('tasks_done',[]);
  closeModal();renderTab('home');showToast('✅ Journée remise à zéro');
}
function adminClearMessages(){setShared('messages',[]);closeModal();showToast('✅ Chat effacé');}
function adminClearPhotos(){setShared('photos',[]);closeModal();showToast('✅ Photos effacées');}

// =================== CAMERA ===================
let cameraTarget='chat';
async function openCamera(target){
  cameraTarget=target;
  const modal=document.getElementById('camera-modal');
  modal.classList.add('show');
  try{
    if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode},audio:false});
    document.getElementById('camera-video').srcObject=cameraStream;
  }catch(e){
    modal.classList.remove('show');
    showToast(t('camera_error'));
  }
}
function closeCamera(){
  if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());
  cameraStream=null;
  document.getElementById('camera-modal').classList.remove('show');
}
function switchCamera(){
  facingMode=facingMode==='environment'?'user':'environment';
  openCamera(cameraTarget);
}
function capturePhoto(){
  const video=document.getElementById('camera-video');
  const canvas=document.getElementById('camera-canvas');
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  const data=canvas.toDataURL('image/jpeg',0.7);
  const now=new Date();
  const timeStr=now.toLocaleTimeString().slice(0,5);
  const dateStr=now.toLocaleDateString();
  
  // Save to photos (shared)
  const photos=getShared('photos',[]);
  photos.unshift({data,by:currentUser.name,time:timeStr,date:dateStr,userId:currentUser.id});
  setShared('photos',photos);
  
  if(cameraTarget==='chat'){
    const msgs=getShared('messages',[]);
    msgs.push({userId:currentUser.id,user:currentUser.name,type:'photo',data,time:timeStr,date:now.toISOString()});
    setShared('messages',msgs);
  }
  
  closeCamera();
  showToast(t('photo_sent'));
  
  if(cameraTarget==='chat') renderChatTab();
  else{planTab='photos';renderTab('planning');}
}

// =================== MODAL ===================
function showModal(html){
  const overlay=document.getElementById('modal-overlay');
  const content=document.getElementById('modal-content');
  content.innerHTML=`<button class="modal-close" onclick="closeModal()">×</button>${html}`;
  overlay.classList.add('show');
}
function closeModal(e){
  if(e&&e.target!==document.getElementById('modal-overlay'))return;
  document.getElementById('modal-overlay').classList.remove('show');
  window._pinModal=null;window._pinModalCb=null;
}

// =================== TOAST ===================
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// =================== SYNC ===================
window.addEventListener('storage',e=>{
  if(e.key&&e.key.startsWith('jst_shared_')){
    if(activeTab) renderTab(activeTab);
  }
});
window.addEventListener('jst_update',()=>{
  if(activeTab) renderTab(activeTab);
});

// Poll for updates every 5s (same device multi-tab simulation)
setInterval(()=>{
  if(currentUser&&activeTab) renderTab(activeTab);
},5000);
</script>
